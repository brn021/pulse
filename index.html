.fitem .it{flex:1;min-width:0}
.fitem .nm{overflow-wrap:anywhere}
.fitem .mc{font-size:12px;color:#9C8E80;margin-top:2px}

.fav span{font-size:11px;color:#9C8E80;font-weight:500;margin-top:2px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.dnav button{background:#1A1613;border:none;color:#EDE6DF;width:44px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}

</style>

<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG — cola aqui o URL /exec do Apps Script (o mesmo de antes).
   Se deixares o placeholder, a app pede o URL no ecrã e guarda-o.
   ═══════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbyz6p6Tvwb7qUCF4I4YI3p3OZ7nRB0aNpllo0RPVqXUtsckuSuRDxx_3zVyVB74dLBLxg/exec";

/* ═══ PLAN v4 — Ginásio A/B/C + Casa ═══ */
const PLAN_NAME = "Plan v4";
const BLOCK_START = "2026-09-28"; // Monday of week 1

const PLAN = {
  "Gym A": { type:"gym", c:"#C97D43", day:"Sat", sub:"Push · Quads · Calves",
    cue:"Compounds: rest 2–3 min · Isolation: 60–120 s · Most sets 1–3 reps in reserve. Dips and anything new: 2–3 in reserve. Ab machine: light, no forcing range; watch how the back feels over the next 24 h.",
    ex:[
      {n:"DB Chest Press", sets:3, t:"10–15", defKg:22.5, ref:"22.5kg per DB"},
      {n:"Dips", sets:2, t:"6–12", assist:true, ref:"kg = assistance · 2–3 in reserve"},
      {n:"Chest Fly Machine", sets:2, t:"10–15", defKg:46, ref:"46kg"},
      {n:"Leg Extension", sets:2, maxSets:3, t:"12–15", defKg:46, ref:"46kg · 3rd set from the 4-week review (26 Oct)"},
      {n:"Cable Lateral Raises", sets:3, t:"12–20", defKg:7, ref:"7–8kg"},
      {n:"Reverse Pec Deck", sets:2, t:"12–20", defKg:11, ref:"balances the pushing", aka:["Rear delt - on pec fly machine","Reverse pec fly (shoulder/back)","Rear Delt"]},
      {n:"Tricep Pushdown", sets:2, maxSets:3, t:"10–15", defKg:18, ref:"18–20kg · 3rd set from the 2-week review (12 Oct)"},
      {n:"Seated Calf Raise", sets:3, t:"12–20", defKg:25, ref:"25kg"},
      {n:"Ab Machine (Gymleco 370)", sets:1, maxSets:2, t:"12–15", ref:"light · 3–4 in reserve · 2nd set once well tolerated"},
    ]},
  "Gym B": { type:"gym", c:"#D89A5B", day:"Sun", sub:"Pull · Hamstrings · Calves",
    cue:"Pull-ups at home today already count as back work — no pulldown, low row or pullover here. Optional pair: row ↔ leg curl.",
    ex:[
      {n:"Plate-Loaded Row", sets:3, maxSets:4, t:"8–12", defKg:30, ref:"30kg (same machine/grip) · 4th set from 12 Oct"},
      {n:"Seated Leg Curl", sets:3, maxSets:4, t:"10–15", defKg:39, ref:"39kg · 4th set from 12 Oct, if recovered"},
      {n:"Reverse Pec Deck", sets:3, t:"12–20", defKg:11, ref:"light, clean squeeze", aka:["Rear delt - on pec fly machine","Reverse pec fly (shoulder/back)","Rear Delt"]},
      {n:"Incline Curls", sets:2, maxSets:3, t:"10–15", defKg:8, ref:"8–9kg per DB · 3rd set from 12 Oct"},
      {n:"Seated Calf Raise", sets:3, t:"12–20", defKg:25, ref:"25kg"},
      {n:"Hip Thrust Machine", sets:0, maxSets:3, t:"10–15", ref:"only after the physio has seen it · from 26 Oct · ribs down, no arching at the top"},
    ]},
  "Gym C": { type:"gym", c:"#B5651D", day:"Thu", sub:"Short top-up · 30–40 min",
    cue:"Short session. No overhead press or extra pulling at the gym today. If energy is short on Thursday, keep the home blocks and skip this one.",
    ex:[
      {n:"Machine Chest Press", sets:3, t:"8–12", ref:"load by effort"},
      {n:"Seated Leg Curl", sets:2, t:"10–15", defKg:39, ref:"39kg"},
      {n:"Cable Lateral Raises", sets:2, t:"12–20", defKg:7, ref:"7–8kg"},
      {n:"Seated Calf Raise", sets:2, t:"12–20", defKg:25, ref:"25kg"},
      {n:"Ab Machine (Gymleco 370)", sets:0, maxSets:2, t:"12–15", ref:"only after Saturdays have gone well"},
    ]},
  "Home Squat+Press": { type:"home", c:"#A85D3A", day:"Tue · Thu · Sat", sub:"2×12kg KB · 3 sets",
    cue:"Squat, stand fully, pause, then a controlled press. Rest 2–3 min — not a circuit. Stop with 2–3 clean reps in reserve (Saturday: at least 3). No thrusters, swings or jumps. Press on sets 1–2 this week, all 3 from next week if there are no symptoms. If the press is about to fail before the legs, finish the set as squat only.",
    ex:[
      {n:"KB Squat + Press", sets:3, t:"12–15", oneKg:true, defKg:24, rir:true, time:true, press:true, pressDefault:2, limiter:true, ref:"24kg total"},
      {n:"KB Bulgarian Split Squat", sets:0, maxSets:2, t:"8–12 / leg", oneKg:true, defKg:24, rir:true, time:true, ref:"from 26 Oct, once 15 squats feel easy: replaces squat sets 2–3 · rear foot on a chair · reps per leg"},
    ]},
  "Home Pull-ups": { type:"home", c:"#E0A96D", day:"Tue · Thu · Sun", sub:"3×6–8 · 4th set optional",
    cue:"1–3 reps in reserve — don't chase rep 8 with swinging or half reps. Log each set when you do it; the time saves automatically. Sets hours apart are fine, just log them as they happen.",
    ex:[
      {n:"Pull-ups", sets:3, maxSets:4, t:"6–8", bw:true, rir:true, time:true},
    ]},
};

// weekday → scheduled blocks (0 = Sunday)
const WEEK = {
  0:["Home Pull-ups","Gym B"],
  1:[],
  2:["Home Squat+Press","Home Pull-ups"],
  3:[],
  4:["Gym C","Home Squat+Press","Home Pull-ups"],
  5:[],
  6:["Gym A","Home Squat+Press"],
};
const DAYN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const GYM = ["Gym A","Gym B","Gym C"];
const LIMITS = ["Legs","Shoulders","Breathing","Discomfort"];
const DRAFTS_KEY = "pulse-drafts-v7";
const URL_KEY = "pulse-api-url";
const KCAL_KEY = "pulse-kcal-target";
const PROTEIN_TARGET = 160;
const MEALS = ["Breakfast","Lunch","Snack","Dinner"];

/* ── STATE ── */
let DATA = { workouts:[], weight:[], nutrition:[], food:[] };
let FDAY = null; // date shown in the Food screen
let SESSIONS = [];
let V="loading", WK=null, CUR=null, DET=null, TT=null, MODAL=null, BUSY=false;
// CUR = { wk, date, ex:[{...plan ex, kg, note, limit, sets:[{kg,reps,rir,time,p}]}] }

/* ── HELPERS ── */
const pad=n=>String(n).padStart(2,"0");
const localDate=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>localDate();
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const parseD=s=>{const p=String(s).slice(0,10).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return localDate(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const mondayOf=s=>{const d=parseD(s);return addDays(s,-((d.getDay()+6)%7));};
const fd=s=>{const d=parseD(s);return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];};
const shortD=s=>{const d=parseD(s);return d.getDate()+"/"+(d.getMonth()+1);};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colorOf=w=>PLAN[w]?.c||"#8B7B6B";
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;

function apiUrl(){
  if(API_URL.indexOf("PASTE_")!==0) return API_URL;
  try{return localStorage.getItem(URL_KEY)||"";}catch{return "";}
}
async function apiGet(){ const r=await fetch(apiUrl(),{method:"GET"}); return r.json(); }
async function apiPost(payload){
  const r=await fetch(apiUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  return r.json();
}

/* ── DATA ── */
function reconstruct(){
  const map={};
  DATA.workouts.forEach(row=>{
    const sid=String(row.SessionID);
    if(!map[sid]) map[sid]={id:sid,date:String(row.Date).slice(0,10),workout:String(row.Workout),ex:{},order:[]};
    const S=map[sid], n=String(row.Exercise);
    if(!S.ex[n]){S.ex[n]={name:n,bw:row.BW==="Y",sets:[]};S.order.push(n);}
    S.ex[n].sets.push({kg:row.Weight,reps:row.Reps,rir:row.RIR??"",time:row.Time||"",note:String(row.Note||"")});
  });
  SESSIONS=Object.values(map).map(s=>({...s,exercises:s.order.map(n=>s.ex[n])}))
    .sort((a,b)=>a.date.localeCompare(b.date)||(parseInt(a.id)||0)-(parseInt(b.id)||0));
}
// most recent performance of an exercise, in any workout
function lastEx(name,aka){
  const names=[name].concat(aka||[]);
  for(let i=SESSIONS.length-1;i>=0;i--){
    const e=SESSIONS[i].exercises.find(x=>names.includes(x.name));
    if(e) return {date:SESSIONS[i].date,ex:e};
  }
  return null;
}
function doneOn(w,date){ return SESSIONS.some(s=>s.workout===w&&s.date===date); }
function weekCounts(){
  const t=today(), mon=mondayOf(t);
  const wk=SESSIONS.filter(s=>s.date>=mon&&s.date<=t);
  return {gym:wk.filter(s=>GYM.includes(s.workout)).length, sq:wk.filter(s=>s.workout==="Home Squat+Press").length, pu:wk.filter(s=>s.workout==="Home Pull-ups").length};
}
function lastLabel(){
  if(!SESSIONS.length) return "–";
  const d=daysBetween(SESSIONS[SESSIONS.length-1].date,today());
  if(d<=0) return "Today"; if(d===1) return "Yesterday"; return d+"d ago";
}
function blockWeek(){ return Math.floor(daysBetween(BLOCK_START,today())/7)+1; }
function weights(){ return DATA.weight.map(r=>({d:String(r.Date).slice(0,10),kg:num(r.Weight_kg),waist:num(r.Waist_cm)})).sort((a,b)=>a.d.localeCompare(b.d)); }
function avg7(){
  const t=today(), from=addDays(t,-6);
  const v=weights().filter(x=>x.kg!=null&&x.d>=from&&x.d<=t).map(x=>x.kg);
  return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null;
}
function latest(arr,key){ const v=arr.filter(x=>x[key]!=null); return v.length?v[v.length-1]:null; }
function foods(){
  return (DATA.food||[]).map(r=>({id:String(r.EntryID),d:String(r.Date).slice(0,10),t:String(r.Time||""),meal:String(r.Meal||""),item:String(r.Item||""),k:num(r.Kcal),p:num(r.Protein_g),c:num(r.Carbs_g),f:num(r.Fat_g),src:String(r.Source||"")}));
}
function dayTotals(d){
  const L=foods().filter(x=>x.d===d), sm=k=>L.reduce((a,x)=>a+(x[k]||0),0);
  return {n:L.length,k:sm("k"),p:sm("p"),c:sm("c"),f:sm("f")};
}
function favourites(){
  const g={};
  foods().forEach(x=>{ const key=x.item.trim().toLowerCase(); if(!key) return; const o=g[key]||(g[key]={n:0,last:null}); o.n++; if(!o.last||(x.d+x.t)>=(o.last.d+o.last.t)) o.last=x; });
  return Object.values(g).sort((a,b)=>b.n-a.n||(b.last.d+b.last.t).localeCompare(a.last.d+a.last.t)).slice(0,14).map(o=>o.last);
}
function kcalTarget(){ try{return num(localStorage.getItem(KCAL_KEY));}catch{return null;} }
function mealByTime(){ const h=new Date().getHours(); return h<11?"Breakfast":h<15?"Lunch":h<18?"Snack":"Dinner"; }
const r0=v=>Math.round(v||0);
function curProtein(){ const n=[...DATA.nutrition].sort((a,b)=>String(a.Date).localeCompare(String(b.Date))); const t=n.find(x=>String(x.Date).slice(0,10)===today()); return t?num(t.Protein_g):null; }

/* ── DRAFTS (several at once, e.g. pull-ups spread over the day + a gym session) ── */
function loadDrafts(){ try{return JSON.parse(localStorage.getItem(DRAFTS_KEY))||{};}catch{return {};} }
function saveDrafts(d){ try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(d));}catch{} }
function saveCur(){ if(!CUR) return; const d=loadDrafts(); d[CUR.wk]=CUR; saveDrafts(d); }
function dropDraft(w){ const d=loadDrafts(); delete d[w]; saveDrafts(d); }

function newSession(w){
  const P=PLAN[w];
  return { wk:w, date:today(), ex:P.ex.map(e=>{
    const L=lastEx(e.n,e.aka);
    const lastKg = L ? (L.ex.sets.map(s=>num(s.kg)).filter(v=>v!=null).pop() ?? null) : null;
    const kg = lastKg!=null ? lastKg : (e.defKg!=null?e.defKg:"");
    const lastSets = L?L.ex.sets:[];
    return {...e, ps:e.sets, kg:e.oneKg?kg:"", note:"", limit:"", sets:Array.from({length:e.sets},(_,i)=>({
      kg:e.oneKg||e.bw?"":kg, reps:"", rir:"", time:"",
      p: e.press ? (lastSets.length ? /(^|\|)\s*press/.test(lastSets[i]?.note||"") && !/no press/.test(lastSets[i]?.note||"") : i<(e.pressDefault||1)) : false,
      last: lastSets[i] ? lastSets[i].reps : ""
    }))};
  })};
}

function R(){
  const $=document.getElementById("app");
  if(TT){ clearTimeout(R._t); R._t=setTimeout(()=>{TT=null;R();},2500); }
  const modalHtml=MODAL?renderModal():"";
  const toastHtml=TT?`<div class="toast ${TT.err?"err":""}">${esc(TT.msg)}</div>`:"";
  let h="";
  if(!apiUrl()) h=renderSetup();
  else if(V==="loading") h=`<div class="pg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div class="logo" style="margin:0"><div class="dot"></div><h1>PULSE</h1></div><div class="spin"></div><p style="font-size:13px" class="mt">Syncing with the Sheet…</p></div>`;
  else if(V==="error") h=`<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1></div><div class="banner err">Couldn't reach the Sheet. Check your connection and the Apps Script URL.</div><button class="bc" onclick="boot()">Try again</button><button class="bg" onclick="resetUrl()">Change Apps Script URL</button></div>`;

function setStr(e,s){
  let t=e.bw?String(s.reps):((num(s.kg)??"?")+"kg×"+s.reps);

  if(s.rir!==""&&s.rir!=null) t+=" RIR"+s.rir;
  if(s.time) t+=" @"+s.time;
  return t;
}
function exNotes(e){
  const o={};
  e.sets.forEach(s=>String(s.note||"").split("|").map(x=>x.trim()).filter(x=>x&&!/press/.test(x)&&x!=="assist").forEach(x=>o[x]=1));
  return Object.keys(o);
}

function weightChart(s){
  if(!s.length) return `<p style="font-size:13px;text-align:center;padding:20px 0" class="dm">No weight data</p>`;
  const vals=s.map(e=>e.kg), min=Math.min(...vals), max=Math.max(...vals);
  const pd=(max-min)<1?1:(max-min)*.15, lo=min-pd, hi=max+pd;
  const Wd=300,H=130,px=22,py=12;
  const X=i=>s.length===1?Wd/2:px+i*(Wd-px-8)/(s.length-1);
  const Y=v=>H-py-(v-lo)*(H-2*py)/(hi-lo);
  let h=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto">`;
  h+=`<text x="0" y="${Y(max)+3}" fill="#9C8E80" font-size="9">${max}</text><text x="0" y="${Y(min)+3}" fill="#9C8E80" font-size="9">${min}</text>`;
  if(s.length>1) h+=`<polyline points="${s.map((e,i)=>X(i)+","+Y(e.kg)).join(" ")}" fill="none" stroke="#C97D43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  s.forEach((e,i)=>{ h+=`<circle cx="${X(i)}" cy="${Y(e.kg)}" r="3.5" fill="#C97D43"/>`; });
  h+=`<text x="${px}" y="${H-1}" fill="#9C8E80" font-size="9">${shortD(s[0].d)}</text>`;
  if(s.length>1) h+=`<text x="${Wd-8}" y="${H-1}" fill="#9C8E80" font-size="9" text-anchor="end">${shortD(s[s.length-1].d)}</text>`;
  return h+`</svg>`;
}

  let h=`<div class="pg"><button class="bb" onclick="menu()">← back</button>
    <div class="dnav"><button onclick="foodDay(-1)">‹</button><div style="text-align:center"><div style="font-size:20px;font-weight:800">Food</div><div class="mt" style="font-size:13px">${d===today()?"Today · ":""}${fd(d)}</div></div><button onclick="foodDay(1)" ${d>=today()?'disabled style="opacity:.3"':""}>›</button></div>`;
  const pp=Math.min(100,r0(T.p/PROTEIN_TARGET*100));
  h+=`<div class="ftot"><div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div onclick="setKcalTarget()" style="cursor:pointer"><div class="big">${r0(T.k)}<small> ${tg?"/ "+tg+" ":""}kcal</small></div><div class="mt" style="font-size:11px">${tg?"target · tap to change":"tap to set a kcal target"}</div></div>
    <div style="text-align:right;font-size:13px" class="mt">C ${r0(T.c)}g · F ${r0(T.f)}g</div></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-size:13px"><span>Protein <b>${r0(T.p)}g</b></span><span class="mt">target ${PROTEIN_TARGET}g+</span></div>
    <div class="bar"><i style="width:${pp}%;${T.p>=PROTEIN_TARGET?"background:#8FB573":""}"></i></div>
    <div class="mt" style="font-size:12px;margin-top:8px;cursor:pointer" onclick="logSleep()">Sleep last night: <b style="color:#EDE6DF">${sleep!=null?sleep+" h":"–"}</b> ✎</div></div>`;
  h+=`<button class="bc" style="margin-top:0" onclick="pasteFood()">📋 Paste from Claude</button>
    <div style="display:flex;gap:8px"><button class="bg" onclick="quickFood()">+ Quick add</button><button class="bg" onclick="copyFoodPrompt()">Copy instructions for Claude</button></div>`;
  if(!L.length) h+=`<p class="mt" style="font-size:13px;margin:16px 0">Nothing logged for this day. Send Claude a photo or description of the meal together with the instructions, then paste the lines it gives you.</p>`;
  MEALS.concat([...new Set(L.map(x=>x.meal).filter(m=>!MEALS.includes(m)))]).forEach(m=>{
    const M=L.filter(x=>x.meal===m); if(!M.length) return;
    h+=`<p class="lb">${esc(m)} · ${r0(M.reduce((a,x)=>a+(x.k||0),0))} kcal</p>`;
    M.forEach(x=>{ h+=`<div class="fitem"><div class="it"><div class="nm">${esc(x.item)}</div><div class="mc">${r0(x.k)} kcal · ${r0(x.p)}g P${x.c!=null?" · "+r0(x.c)+"g C":""}${x.f!=null?" · "+r0(x.f)+"g F":""}</div></div><button class="brm" onclick="delFood('${esc(x.id)}')">✕</button></div>`; });
  });
  const F=favourites();
  if(F.length){
    h+=`<p class="lb">Tap to add again</p><div>`;
    F.forEach((x,i)=>{ h+=`<button class="fav" onclick="addFav(${i})">${esc(x.item)}<span>${r0(x.k)} kcal · ${r0(x.p)}g P</span></button>`; });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function parseFood(text, defDate){
  const out=[];
  String(text||"").split(/\r?\n/).forEach(line=>{
    const l=line.trim().replace(/^[-*•>`\s]+/,"");
    if(!/^FOOD\s*\|/i.test(l)) return;
    const p=l.split("|").map(x=>x.trim());
    if(p.length<6) return;
    const k=parseFloat(p[4]); if(isNaN(k)) return;
    const pr=parseFloat(p[5]), cb=parseFloat(p[6]), ft=parseFloat(p[7]);
    const mm=MEALS.find(m=>m.toLowerCase()===String(p[2]).toLowerCase());
    out.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), date:/^\d{4}-\d{2}-\d{2}$/.test(p[1])?p[1]:defDate, time:nowTime(),
      meal:mm||p[2]||"Snack", item:p[3]||"Item", kcal:k, protein:isNaN(pr)?"":pr, carbs:isNaN(cb)?"":cb, fat:isNaN(ft)?"":ft, source:"claude"});
  });
  return out;
}
async function saveFood(entries, msg){
  try{
    const r=await apiPost({action:"logFood",entries}); if(!r.ok) throw 0;
    await boot(true);
    TT={msg};
  }catch{ TT={msg:"⚠ Save failed — try again with signal",err:true}; }
  R();
}

    const E=parseFood(v.txt, FDAY||today());
    if(!E.length){ TT={msg:"No FOOD| lines found",err:true}; R(); return; }
    const k=E.reduce((a,x)=>a+x.kcal,0), pr=E.reduce((a,x)=>a+(+x.protein||0),0);
    saveFood(E, `✓ ${E.length} item${E.length>1?"s":""} added · ${r0(k)} kcal · ${r0(pr)}g P`);
  }}; R();
};
window.quickFood=function(){

window.addFav=function(i){

window.delFood=function(id){ MODAL={title:"Remove this item?",danger:true,ok:"Remove",cb:async()=>{ try{ await apiPost({action:"deleteFood",id}); await boot(true); }catch{ TT={msg:"⚠ Couldn't remove",err:true}; } R(); }}; R(); };
window.setKcalTarget=function(){ MODAL={title:"Daily kcal target",msg:"Leave empty for no target. We'll set it from your first 1–2 weeks of logs.",fields:[{key:"k",label:"kcal",type:"number",val:kcalTarget()??""}],ok:"Save",cb:v=>{ try{ if(num(v.k)) localStorage.setItem(KCAL_KEY,String(num(v.k))); else localStorage.removeItem(KCAL_KEY);}catch{} }}; R(); };
window.copyFoodPrompt=function(){
  const d=FDAY||today();

    "For each item in my photo or description, estimate the portion (include cooking oil and sauces) and give kcal, protein, carbs and fat. "+
    "Write one short line with your assumptions, then ONLY a code block with one line per item in exactly this format:\n"+
    "FOOD|YYYY-MM-DD|Meal|Item (portion)|kcal|protein|carbs|fat\n"+

};
window.logSleep=function(){
  const d=FDAY||today(), t=DATA.nutrition.find(x=>String(x.Date).slice(0,10)===d);

function renderModal(){
  let h=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="md"><h3>${esc(MODAL.title)}</h3>`;
  if(MODAL.msg) h+=`<p>${esc(MODAL.msg)}</p>`;
  (MODAL.fields||[]).forEach(f=>{
    h+=`<label>${esc(f.label)}</label>`;
    if(f.type==="textarea") h+=`<textarea id="f_${f.key}" placeholder="${esc(f.ph||"")}">${esc(f.val??"")}</textarea>`;
    else h+=`<input id="f_${f.key}" type="${f.type||"text"}" ${f.type==="number"?'inputmode="decimal"':""} placeholder="${esc(f.ph||"")}" value="${esc(f.val??"")}">`;
  });
  h+=`<div class="mdrow"><button class="mdc" onclick="closeModal()">Cancel</button><button class="${MODAL.danger?"mddanger":"mdok"}" onclick="modalConfirm()">${esc(MODAL.ok||"Save")}</button></div></div></div>`;
  return h;
}

/* ── ACTIONS ── */
window.saveUrl=function(){ const v=(document.getElementById("urlIn").value||"").trim(); if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){TT={msg:"That doesn't look like an /exec URL",err:true};R();return;} try{localStorage.setItem(URL_KEY,v);}catch{} boot(); };

window.askDiscard=function(w){ MODAL={title:"Discard "+w+"?",msg:"Nothing from this workout will be saved.",danger:true,ok:"Discard",cb:()=>{dropDraft(w); if(CUR&&CUR.wk===w){CUR=null;V="menu";}}}; R(); };

window.addSet=function(ei){ const e=CUR.ex[ei]; e.sets.push({kg:e.sets[e.sets.length-1]?.kg||"",reps:"",rir:"",time:"",p:false,last:""}); saveCur(); R(); };
window.rmSet=function(ei){ CUR.ex[ei].sets.pop(); saveCur(); R(); };
window.noteEx=function(ei){ const e=CUR.ex[ei]; MODAL={title:"Note — "+e.n,msg:"Grip, range, machine, how it felt…",fields:[{key:"note",label:"Note",val:e.note}],ok:"Save",cb:v=>{e.note=(v.note||"").replace(/\|/g,"/").trim(); saveCur();}}; R(); };
window.askAddEx=function(){ MODAL={title:"Add exercise",msg:"Only if it was cleared/planned — the plan says not to add work just because there's time.",fields:[{key:"name",label:"Name",ph:"Exercise"},{key:"sets",label:"Sets",type:"number",val:"3"}],ok:"Add",cb:v=>{ const n=(v.name||"").trim(); if(!n) return; const k=Math.max(1,Math.min(6,+v.sets||3)); const L=lastEx(n); const lk=L?(L.ex.sets.map(s=>num(s.kg)).filter(x=>x!=null).pop()??""):""; CUR.ex.push({n, ps:k, t:"", added:true, bw:false, kg:"", note:"", limit:"", sets:Array.from({length:k},(_,i)=>({kg:lk,reps:"",rir:"",time:"",p:false,last:L?.ex.sets[i]?.reps??""}))}); saveCur(); }}; R(); };
window.rmEx=function(ei){ MODAL={title:"Remove "+CUR.ex[ei].n+"?",danger:true,ok:"Remove",cb:()=>{CUR.ex.splice(ei,1); saveCur();}}; R(); };

function buildPayload(){
  const exercises=[], skipped=[];
  CUR.ex.forEach(e=>{
    const sets=[];
    e.sets.forEach(s=>{
      if(num(s.reps)==null||+s.reps<=0) return;
      const notes=[];
      if(e.assist&&num(s.kg)) notes.push("assist");
      if(e.press) notes.push(s.p?"press":"no press");
      if(e.limit) notes.push("limit: "+e.limit.toLowerCase());
      if(e.note) notes.push(e.note);
      sets.push({ kg: e.bw?"":(e.oneKg?(num(e.kg)??""):(num(s.kg)??"")), reps:+s.reps, rir:num(s.rir)??"", time:s.time||"", note:notes.join(" | ") });
    });
    if(sets.length) exercises.push({name:e.n,bw:!!e.bw,sets}); else skipped.push(e.n);
  });
  return {exercises,skipped};
}

window.finish=async function(){
  if(BUSY) return;
  const {exercises,skipped}=buildPayload();
  if(!exercises.length){ TT={msg:"Nothing logged yet — enter reps first",err:true}; R(); return; }
  const payload={action:"logWorkout",workout:CUR.wk,date:CUR.date,sessionId:Date.now()+"-"+Math.random().toString(36).slice(2,6),exercises};
  BUSY=true; R();
  try{
    const res=await apiPost(payload);
    if(!(res&&res.ok)) throw new Error(res&&res.error||"save failed");
    dropDraft(CUR.wk); const w=CUR.wk; CUR=null;
    try{ await boot(true); }catch{}
    DET=SESSIONS.find(s=>s.id===payload.sessionId)||{id:payload.sessionId,workout:w,date:payload.date,exercises:exercises.map(e=>({name:e.name,bw:e.bw,sets:e.sets}))};
    DET.skipped=skipped;
    BUSY=false; V="done"; R(); window.scrollTo(0,0);
  }catch(err){
    BUSY=false; TT={msg:"⚠ Save failed — kept on this phone. Try again with signal.",err:true}; R();
  }
};

window.det=function(id){ DET=SESSIONS.find(s=>s.id===id); if(DET){V="det";R();window.scrollTo(0,0);} };
window.editDate=function(){ MODAL={title:"Change workout date",fields:[{key:"date",label:"Date",type:"date",val:DET.date}],ok:"Save",cb:async v=>{ if(!v.date) return; try{ const r=await apiPost({action:"setSessionDate",sessionId:DET.id,date:v.date}); if(!r.ok) throw 0; const id=DET.id; await boot(true); DET=SESSIONS.find(s=>s.id===id)||DET; TT={msg:"✓ Date changed"}; }catch{ TT={msg:"⚠ Couldn't change date",err:true}; } R(); }}; R(); };
window.askDelSession=function(){ MODAL={title:"Delete this session?",msg:"Removes it from the Sheet permanently.",danger:true,ok:"Delete",cb:async()=>{ try{ await apiPost({action:"deleteSession",sessionId:DET.id}); await boot(true); V="menu"; TT={msg:"Deleted"}; }catch{ TT={msg:"⚠ Delete failed",err:true}; } R(); }}; R(); };

window.openWeight=function(){ V="weight"; R(); window.scrollTo(0,0); };
window.logWeight=function(){
  const lw=latest(weights(),"kg");
  MODAL={title:"Log body",fields:[{key:"kg",label:"Weight (kg)",type:"number",ph:lw?String(lw.kg):"81.5"},{key:"waist",label:"Waist (cm) — optional",type:"number",ph:"at the navel"},{key:"date",label:"Date",type:"date",val:today()}],ok:"Save",cb:async v=>{
    if(!v.date||(!v.kg&&!v.waist)) return;
    try{ const r=await apiPost({action:"logWeight",kg:v.kg,waist:v.waist,date:v.date}); if(!r.ok) throw 0; await boot(true); TT={msg:"✓ Saved"}; }catch{ TT={msg:"⚠ Save failed",err:true}; }
    R();
  }}; R();
};
window.logNutrition=function(){
  const t=DATA.nutrition.find(x=>String(x.Date).slice(0,10)===today());
  MODAL={title:"Nutrition — today",fields:[{key:"protein",label:"Protein (g)",type:"number",ph:"160",val:t?.Protein_g??""},{key:"calories",label:"Calories",type:"number",ph:"2600",val:t?.Calories??""},{key:"sleep",label:"Sleep last night (h)",type:"number",ph:"8",val:t?.Sleep_h??""}],ok:"Save",cb:async v=>{
    try{ const r=await apiPost({action:"logNutrition",date:today(),protein:v.protein,calories:v.calories,sleep:v.sleep}); if(!r.ok) throw 0; await boot(true); TT={msg:"✓ Saved"}; }catch{ TT={msg:"⚠ Save failed",err:true}; }
    R();
  }}; R();
};
window.closeModal=function(){ MODAL=null; R(); };
window.modalConfirm=function(){ const cb=MODAL.cb, v={}; (MODAL.fields||[]).forEach(f=>{const el=document.getElementById("f_"+f.key); v[f.key]=el?el.value:null;}); MODAL=null; if(cb) cb(v); R(); };

function copyText(t,msg){
  const ok=()=>{TT={msg};R();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(fallback); else fallback();
  function fallback(){ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch{} document.body.removeChild(a); ok(); }
}
window.genReport=async function(){
  if(BUSY) return;
  BUSY=true; TT={msg:"Generating report…"}; R();
  try{
    const res=await apiPost({action:"buildReport"});
    BUSY=false;
    if(res&&res.ok&&res.text) copyText(res.text,"✓ Report copied — paste it in the chat");
    else { TT={msg:"⚠ Report failed",err:true}; R(); }
  }catch{ BUSY=false; TT={msg:"⚠ Report failed — check connection",err:true}; R(); }
};
window.cp=function(id){
  const s=SESSIONS.find(x=>x.id===id)||DET; if(!s) return;
  let t=s.workout+" · "+fd(s.date)+"\n";
  s.exercises.forEach(e=>{
    const assist=e.sets.some(x=>/assist/.test(x.note));
    const ns=exNotes(e);
    t+=e.name+(assist?" (kg = assistance)":"")+": "+e.sets.map(x=>setStr(e,x)).join(" / ")+(ns.length?" ["+ns.join("; ")+"]":"")+"\n";
  });
  if(s.skipped&&s.skipped.length) t+="Not done: "+s.skipped.join(", ")+"\n";
  copyText(t,"✓ Copied");
};

/* ── BOOT ── */
async function boot(silent){
  if(!apiUrl()){ R(); return; }
  if(!silent){ V="loading"; R(); }
  try{
    DATA=await apiGet();
    DATA.workouts=DATA.workouts||[]; DATA.weight=DATA.weight||[]; DATA.nutrition=DATA.nutrition||[]; DATA.food=DATA.food||[];
    reconstruct();
    if(!silent){ V="menu"; R(); }
  }catch(err){
    if(!silent){ V="error"; R(); } else throw err;
  }
}
window.boot=boot;
boot();
