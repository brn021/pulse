<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0B09">
<title>PULSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0D0B09;color:#EDE6DF;font-family:-apple-system,system-ui,sans-serif;min-height:100dvh}
input{-webkit-appearance:none;-moz-appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{display:none}
.pg{padding:16px;min-height:100dvh}
.sp{padding:12px 12px 100px}
.logo{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.logo h1{font-size:22px;font-weight:800;letter-spacing:6px}
.dot{width:11px;height:11px;border-radius:50%;background:#C97D43;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,125,67,.55)}70%{box-shadow:0 0 0 11px rgba(201,125,67,0)}100%{box-shadow:0 0 0 0 rgba(201,125,67,0)}}
.phase{margin-left:auto;font-size:12px;color:#9C8E80;font-weight:600}
.hero{width:100%;background:linear-gradient(135deg,#C97D4316,#1A1613 60%);border:1px solid #C97D4340;border-radius:18px;padding:20px 18px;margin-bottom:14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.hero .lbl{font-size:11px;font-weight:700;color:#C97D43;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.hero .name{font-size:30px;font-weight:800;line-height:1.1}
.hero .sub{font-size:13px;color:#9C8E80;margin-top:4px}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:#1A1613;border-radius:14px;padding:14px 8px;text-align:center;border:none;color:#EDE6DF}
.stat .num{font-size:22px;font-weight:800}
.stat .lbl{font-size:9px;color:#9C8E80;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.mini{display:flex;gap:8px;margin-bottom:18px}
.mcard{flex:1;background:#1A1613;border:none;border-radius:14px;padding:12px;cursor:pointer;color:#EDE6DF;text-align:left}
.mcard .lbl{font-size:10px;font-weight:700;color:#9C8E80;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.mcard .val{font-size:20px;font-weight:800;color:#C97D43}
.mcard .val small{font-size:12px;font-weight:700}
.bw{width:100%;padding:16px 14px;margin-bottom:8px;background:#1A1613;border:none;border-radius:14px;color:#EDE6DF;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.bh{width:100%;padding:11px 14px;margin-bottom:6px;background:#1A1613;border:none;border-radius:10px;color:#EDE6DF;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.ec{background:#1A1613;border-radius:14px;padding:12px;margin-bottom:10px}
.inp{flex:1;height:50px;background:#0D0B09;border:2px solid #2B2520;border-radius:12px;font-size:20px;font-weight:700;text-align:center;outline:none;color:#EDE6DF;width:100%}
.ikg{color:#C97D43}
.bs{position:fixed;bottom:0;left:0;right:0;padding:10px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0D0B09 25%)}
.bs button{width:100%;padding:18px;border:none;border-radius:14px;color:#1A1613;font-size:18px;font-weight:800;cursor:pointer}
.bs button:disabled{opacity:.6}
.bb{background:none;border:none;color:#9C8E80;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:12px}
.bm{margin-top:28px;padding:16px 48px;background:#1A1613;border:2px solid #2B2520;border-radius:14px;color:#EDE6DF;font-size:16px;font-weight:700;cursor:pointer}
.bc{width:100%;padding:16px;background:#1A1613;border:2px solid #C97D4355;border-radius:14px;color:#C97D43;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.badd{width:100%;padding:14px;background:transparent;border:2px dashed #2B2520;border-radius:12px;color:#9C8E80;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.bn{margin-top:20px;width:100%;padding:10px;background:transparent;border:1px solid #C9434322;border-radius:10px;color:#C94343;font-size:12px;cursor:pointer}
.brm{background:none;border:none;color:#7A6E60;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#C97D43;color:#1A1613;padding:10px 24px;border-radius:10px;font-weight:700;font-size:14px;z-index:9999;animation:fo 2.5s forwards;max-width:90%;text-align:center}
.toast.err{background:#C94343;color:#fff}
@keyframes fo{0%,80%{opacity:1}100%{opacity:0}}
.mt{color:#9C8E80}.dm{color:#3A332C}
.lb{font-size:11px;font-weight:700;color:#9C8E80;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9998;display:flex;align-items:center;justify-content:center;padding:24px}
.md{background:#1A1613;border-radius:16px;padding:20px;width:100%;max-width:360px}
.md h3{font-size:17px;font-weight:700;margin-bottom:8px}
.md p{font-size:14px;color:#9C8E80;margin-bottom:14px}
.md label{font-size:11px;color:#9C8E80;text-transform:uppercase;letter-spacing:1px;display:block;margin:10px 0 4px}
.md input{width:100%;height:50px;background:#0D0B09;border:2px solid #2B2520;border-radius:12px;color:#EDE6DF;font-size:18px;font-weight:700;text-align:center;outline:none}
.md input:focus{border-color:#C97D43}
.mdrow{display:flex;gap:8px;margin-top:16px}
.mdrow button{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.mdc{background:#2B2520;color:#EDE6DF}.mdok{background:#C97D43;color:#1A1613}.mddanger{background:#C94343;color:#fff}
.went{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1A1613;border-radius:10px;margin-bottom:6px;font-size:14px}
.chartbox{background:#1A1613;border-radius:16px;padding:16px;margin-bottom:16px}
.spin{width:34px;height:34px;border:3px solid #2B2520;border-top-color:#C97D43;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:#C9434318;border:1px solid #C9434344;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#F0A0A0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG — cola aqui o URL /exec do teu Apps Script deployment
   ═══════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbyz6p6Tvwb7qUCF4I4YI3p3OZ7nRB0aNpllo0RPVqXUtsckuSuRDxx_3zVyVB74dLBLxg/exec";

/* ── PLAN (sem vídeos) ── */
const PLAN = {
  "Push": { type:"gym", c:"#C97D43", sub:"Chest · Shoulders · Triceps", ex:[
    {n:"DB Chest Press", sets:3, t:"12"},
    {n:"Chest Fly Machine", sets:3, t:"12"},
    {n:"Machine Shoulder Press", sets:3, t:"10"},
    {n:"Cable Lateral Raises", sets:3, t:"12"},
    {n:"Tricep Pushdown", sets:3, t:"12"},
    {n:"Lying Tricep Ext (EZ)", sets:3, t:"12"},
    {n:"Seated Calf Raise", sets:3, t:"12"},
  ]},
  "Pull": { type:"gym", c:"#D89A5B", sub:"Back · Biceps", ex:[
    {n:"Lat Pulldown", sets:3, t:"10"},
    {n:"Machine Low Row", sets:3, t:"12"},
    {n:"Plate-Loaded Row", sets:3, t:"10"},
    {n:"DB Pullover", sets:3, t:"12"},
    {n:"Face Pulls", sets:3, t:"15"},
    {n:"Incline Curls", sets:3, t:"12"},
    {n:"Seated Calf Raise", sets:3, t:"12"},
  ]},
  "Legs": { type:"gym", c:"#B5651D", sub:"Quads · Hams · Calves", ex:[
    {n:"Goblet Squat", sets:3, t:"12"},
    {n:"Leg Extension", sets:3, t:"10-12"},
    {n:"Bulgarian Split Squat", sets:3, t:"10/side"},
    {n:"Seated Leg Curl", sets:3, t:"12"},
    {n:"Seated Calf Raise", sets:3, t:"12"},
    {n:"Leg Raises", sets:3, t:"15", bw:true},
  ]},
  "Kettle Full": { type:"kettle", c:"#A85D3A", sub:"~30-35 min · full body", ex:[
    {n:"Plank + KB side-to-side", t:"30 reps"},
    {n:"Trident (L/mid/R)", t:"40 reps"},
    {n:"Woodchoppers", t:"10/side"},
    {n:"Squat KB shoulder", t:"3×12"},
    {n:"Squat + overhead raise", t:"3×10"},
    {n:"Swings", t:"10×12"},
    {n:"Deep push-ups", t:"2×20"},
    {n:"Triceps", t:"2×15"},
    {n:"Biceps (grips)", t:"1×15/grip"},
  ]},
  "Kettle Express": { type:"kettle", c:"#E0A96D", sub:"~12 min · no excuses", ex:[
    {n:"Squat KB shoulder", t:"2×15"},
    {n:"Swings", t:"5×15"},
    {n:"Deep push-ups", t:"2×15"},
    {n:"Plank + KB side-to-side", t:"20 reps"},
  ]},
};
const PPL = ["Push","Pull","Legs"];
const DRAFT_KEY = "pulse-draft-v6";

/* ── STATE ── */
let DATA = { workouts:[], weight:[], nutrition:[] };
let SESSIONS = [];      // reconstructed sessions
let V="loading", WK=null, DT={}, EX=[], DET=null, TT=null, MODAL=null, BUSY=false;

/* ── HELPERS ── */
const fd=(d)=>{const t=new Date(d);return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][t.getDay()]+" "+t.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][t.getMonth()];};
const shortD=(iso)=>{const t=new Date(iso);return t.getDate()+"/"+(t.getMonth()+1);};
const today=()=>new Date().toISOString().slice(0,10);

async function apiGet(){
  const r = await fetch(API_URL, {method:"GET"});
  return r.json();
}
async function apiPost(payload){
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
  return r.json();
}

function reconstruct(){
  // group Workouts rows into sessions
  const map = {};
  DATA.workouts.forEach(row=>{
    const sid = String(row.SessionID);
    if(!map[sid]) map[sid] = { id:sid, date:row.Date, workout:row.Workout, ex:{} };
    const exn = row.Exercise;
    if(!map[sid].ex[exn]) map[sid].ex[exn] = { name:exn, bw:row.BW==='Y', sets:[] };
    map[sid].ex[exn].sets.push({ kg:row.Weight, reps:row.Reps });
  });
  SESSIONS = Object.values(map).map(s=>({ ...s, exercises:Object.values(s.ex) }))
    .sort((a,b)=> new Date(a.date)-new Date(b.date) || Number(a.id)-Number(b.id));
}

function lastSession(name){ return [...SESSIONS].reverse().find(s=>s.workout===name); }
function lastGym(){ return [...SESSIONS].reverse().find(s=>PPL.includes(s.workout)); }
function nextWorkout(){ const g=lastGym(); if(!g) return "Push"; return PPL[(PPL.indexOf(g.workout)+1)%3]; }
function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-day);
  return SESSIONS.filter(s=>new Date(s.date)>=mon).length;
}
function lastLabel(){
  if(!SESSIONS.length) return "–";
  const last=new Date(SESSIONS[SESSIONS.length-1].date);
  const t=new Date(); t.setHours(0,0,0,0); const l=new Date(last); l.setHours(0,0,0,0);
  const diff=Math.round((t-l)/86400000);
  if(diff<=0) return "Today"; if(diff===1) return "Yesterday"; return diff+"d ago";
}
function curWeight(){ if(!DATA.weight.length) return null; const s=[...DATA.weight].sort((a,b)=>String(a.Date).localeCompare(String(b.Date))); return s[s.length-1].Weight_kg; }
function curProtein(){ if(!DATA.nutrition.length) return null; const s=[...DATA.nutrition].sort((a,b)=>String(a.Date).localeCompare(String(b.Date))); return s[s.length-1].Protein_g; }

/* ── RENDER ── */
function R(){
  const $=document.getElementById("app");
  if(TT){setTimeout(()=>{TT=null;R();},2500);}
  const modalHtml = MODAL?renderModal():"";
  const toastHtml = TT?`<div class="toast ${TT.err?'err':''}">${TT.msg}</div>`:"";

  if(API_URL.indexOf("PASTE_")===0){
    $.innerHTML = `<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1></div>
      <div class="banner">⚠ Falta configurar. Cola o URL /exec do Apps Script na constante API_URL no topo do ficheiro.</div></div>`;
    return;
  }

  if(V==="loading"){
    $.innerHTML=`<div class="pg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
      <div class="logo" style="margin:0"><div class="dot"></div><h1>PULSE</h1></div>
      <div class="spin"></div><p style="font-size:13px" class="mt">A sincronizar com o Sheet...</p></div>`;
    return;
  }

  if(V==="error"){
    $.innerHTML=`<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1></div>
      <div class="banner">Não consegui ligar ao Sheet. Verifica o URL e a ligação à net.</div>
      <button class="bc" onclick="boot()">Tentar de novo</button></div>`;
    return;
  }

  if(V==="menu"){ $.innerHTML=renderMenu()+modalHtml+toastHtml; return; }
  if(V==="det"&&DET){ $.innerHTML=renderDetail()+modalHtml+toastHtml; return; }
  if(V==="go"&&WK){ $.innerHTML=renderSession()+modalHtml+toastHtml; return; }
  if(V==="weight"){ $.innerHTML=renderWeight()+modalHtml+toastHtml; return; }
  if(V==="done"&&DET){ $.innerHTML=renderDone()+modalHtml+toastHtml; return; }
}

function renderMenu(){
  const draft=loadDraft();
  const nxt=nextWorkout(), nw=PLAN[nxt];
  const cw=curWeight(), cp=curProtein();
  let h=`<div class="pg">`;
  h+=`<div class="logo"><div class="dot"></div><h1>PULSE</h1><span class="phase">Phase 2</span></div>`;
  h+=`<button class="hero" onclick="go('${nxt}')">
    <div><div class="lbl">Up Next</div><div class="name" style="color:${nw.c}">${nxt}</div>
    <div class="sub">${nw.sub}</div></div><div style="font-size:26px;color:${nw.c}">→</div></button>`;
  h+=`<div class="stats">
    <div class="stat"><div class="num">${weekCount()}</div><div class="lbl">This week</div></div>
    <div class="stat"><div class="num">${SESSIONS.length}</div><div class="lbl">Sessions</div></div>
    <div class="stat"><div class="num" style="font-size:16px;padding-top:4px">${lastLabel()}</div><div class="lbl">Last</div></div></div>`;
  h+=`<div class="mini">
    <button class="mcard" onclick="openWeight()"><div class="lbl">Weight</div><div class="val">${cw!=null?cw:"–"}<small> kg</small></div></button>
    <button class="mcard" onclick="logNutrition()"><div class="lbl">Protein</div><div class="val">${cp!=null?cp:"–"}<small> g</small></div></button></div>`;
  h+=`<button class="bc" style="margin:0 0 14px" onclick="genReport()">📋 Generate report for Claude</button>`;
  if(draft&&draft.wk){
    h+=`<div style="background:#C97D4318;border:1px solid #C97D4344;border-radius:12px;padding:12px;margin-bottom:14px">
      <div style="font-size:13px;color:#C97D43;font-weight:600;margin-bottom:8px">⏳ In progress: ${draft.wk}</div>
      <div style="display:flex;gap:8px">
      <button onclick="resume()" style="flex:1;padding:10px;background:#C97D43;border:none;border-radius:8px;color:#1A1613;font-weight:700;font-size:13px;cursor:pointer">Resume</button>
      <button onclick="askDiscard()" style="flex:1;padding:10px;background:#2B2520;border:none;border-radius:8px;color:#EDE6DF;font-weight:700;font-size:13px;cursor:pointer">Discard</button></div></div>`;
  }
  h+=`<p class="lb">Train</p>`;
  for(const [n,w] of Object.entries(PLAN)){
    const p=lastSession(n);
    h+=`<button class="bw" style="border-left:4px solid ${w.c}" onclick="go('${n}')">
      <div><div style="font-size:17px;font-weight:700;color:${w.c}">${n}${n===nxt?' <span style="font-size:9px;background:'+w.c+'22;color:'+w.c+';padding:2px 7px;border-radius:6px;letter-spacing:1px">UP NEXT</span>':''}</div>
      <div style="font-size:12px;margin-top:2px" class="mt">${w.sub}</div></div>
      <div style="text-align:right">${p?`<div style="font-size:11px" class="mt">${fd(p.date)}</div>`:""}<div style="font-size:22px;color:${w.c}">→</div></div></button>`;
  }
  h+=`<p class="lb" style="margin-top:20px">History</p>`;
  if(!SESSIONS.length) h+=`<p style="font-size:13px" class="dm">No sessions yet</p>`;
  [...SESSIONS].reverse().slice(0,12).forEach(s=>{
    const c=PLAN[s.workout]?.c||"#E0A96D";
    h+=`<button class="bh" onclick="det('${s.id}')"><span><span style="font-weight:700;color:${c}">${s.workout}</span><span style="font-size:12px;margin-left:8px" class="mt">${fd(s.date)}</span></span><span class="dm">→</span></button>`;
  });
  h+=`</div>`;
  return h;
}

function renderSession(){
  const w=PLAN[WK], p=lastSession(WK), isK=w.type==="kettle";
  let h=`<div class="sp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <button class="bb" style="margin:0" onclick="exitSession()">← exit</button>
    <h2 style="font-size:20px;font-weight:800;color:${w.c};margin:0">${WK}</h2><div style="width:40px"></div></div>`;
  h+=`<p style="font-size:11px;text-align:center;margin-bottom:10px" class="dm">${isK?'log reps done':'weight × reps'}</p>`;
  EX.forEach((ex,ei)=>{
    const pe=p?.exercises?.find(x=>x.name===ex.n);
    h+=`<div class="ec" style="border-left:3px solid ${w.c}33"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div style="flex:1"><div style="font-size:15px;font-weight:700">${ex.n}${ex.added?' <span style="font-size:10px;color:'+w.c+'">• extra</span>':''}</div>
      <div style="font-size:11px;margin-top:1px" class="mt">target ${ex.t||'?'}</div>
      ${pe?`<div style="font-size:10px;margin-top:2px" class="dm">Last: ${pe.sets.map(s=>ex.bw||isK?s.reps:s.kg+"×"+s.reps).join(" / ")}</div>`:""}</div>
      ${ex.added?`<button class="brm" onclick="rmEx(${ei})">✕</button>`:""}</div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">`;
    const slots = isK ? 1 : ex.sets;
    for(let si=0; si<slots; si++){
      const sv=DT[ei]?.[si]||{kg:"",reps:""};
      h+=`<div style="display:flex;align-items:center;gap:6px">`;
      if(!isK) h+=`<span style="font-size:12px;width:24px;text-align:center" class="dm">S${si+1}</span>`;
      if(!isK && !ex.bw){
        h+=`<input type="number" inputmode="decimal" placeholder="kg" value="${sv.kg}" class="inp ikg" onchange="up(${ei},${si},'kg',this.value)" onfocus="this.style.borderColor='${w.c}'" onblur="this.style.borderColor='#2B2520'">
             <span style="font-size:18px;font-weight:700" class="dm">×</span>`;
      }
      h+=`<input type="number" inputmode="numeric" placeholder="${isK?'reps done':'reps'}" value="${sv.reps}" class="inp" onchange="up(${ei},${si},'reps',this.value)" onfocus="this.style.borderColor='${w.c}'" onblur="this.style.borderColor='#2B2520'"></div>`;
    }
    h+=`</div></div>`;
  });
  h+=`<button class="badd" onclick="askAddEx()">+ Add exercise</button>`;
  h+=`<div class="bs"><button style="background:${w.c}" onclick="finish()" ${BUSY?'disabled':''}>${BUSY?'Saving…':'✓ FINISH WORKOUT'}</button></div></div>`;
  return h;
}

function renderDetail(){
  const c=PLAN[DET.workout]?.c||"#E0A96D", isK=PLAN[DET.workout]?.type==="kettle";
  let h=`<div class="pg"><button class="bb" onclick="menu()">← back</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><h2 style="font-size:20px;font-weight:700;color:${c};margin:0 0 2px">${DET.workout}</h2>
    <p style="font-size:13px;margin:0 0 14px" class="mt">${fd(DET.date)}</p></div></div>`;
  DET.exercises.forEach(e=>{
    h+=`<div style="background:#1A1613;border-radius:12px;padding:12px;margin-bottom:8px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">${e.name}</div><div style="display:flex;gap:6px;flex-wrap:wrap">`;
    e.sets.forEach(s=>{ h+=`<div style="background:#0D0B09;border-radius:8px;padding:6px 12px;font-size:14px">`+((e.bw||isK)?`<span style="font-weight:700">${s.reps}</span><span class="mt"> reps</span>`:`<span style="color:#C97D43;font-weight:700">${s.kg}</span><span class="mt">kg×</span><span style="font-weight:700">${s.reps}</span>`)+`</div>`; });
    h+=`</div></div>`;
  });
  h+=`<button class="bc" onclick="cp('${DET.id}')">📋 Copy for Claude</button>`;
  h+=`<button class="bn" onclick="askDelSession()">Delete this session</button></div>`;
  return h;
}

function renderWeight(){
  const s=[...DATA.weight].sort((a,b)=>String(a.Date).localeCompare(String(b.Date)));
  const cur=s.length?s[s.length-1].Weight_kg:null, first=s.length?s[0].Weight_kg:null;
  const delta=(cur!=null&&first!=null&&s.length>1)?(cur-first):null;
  let h=`<div class="pg"><button class="bb" onclick="menu()">← back</button>
    <h2 style="font-size:20px;font-weight:800;margin:0 0 2px">Body Weight</h2>
    <p style="font-size:13px;margin:0 0 14px" class="mt">${cur!=null?cur+" kg":"No data"}${delta!=null?` · <span style="color:#C97D43;font-weight:700">${delta>=0?"+":""}${(+delta).toFixed(1)} kg</span> since start`:""}</p>`;
  h+=`<div class="chartbox">${weightChart(s)}</div>`;
  h+=`<button class="bc" style="margin:0 0 16px" onclick="logWeight()">+ Log weight</button><p class="lb">Entries</p>`;
  if(!s.length) h+=`<p style="font-size:13px" class="dm">Nothing logged</p>`;
  [...s].reverse().forEach(e=>{ h+=`<div class="went"><span class="mt">${fd(e.Date+"T12:00:00")}</span><span><b style="color:#C97D43">${e.Weight_kg}</b> kg</span></div>`; });
  h+=`</div>`;
  return h;
}

function weightChart(s){
  if(!s.length) return `<p style="font-size:13px;text-align:center;padding:20px 0" class="dm">No weight data</p>`;
  const vals=s.map(e=>+e.Weight_kg);
  const min=Math.min(...vals),max=Math.max(...vals),pad=(max-min)<1?1:(max-min)*.15,lo=min-pad,hi=max+pad;
  const W=300,H=130,px=16,py=12;
  const X=i=>s.length===1?W/2:px+i*(W-2*px)/(s.length-1);
  const Y=v=>H-py-(v-lo)*(H-2*py)/(hi-lo);
  let h=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  h+=`<text x="2" y="${Y(max)+4}" fill="#9C8E80" font-size="9">${max}</text><text x="2" y="${Y(min)+4}" fill="#9C8E80" font-size="9">${min}</text>`;
  if(s.length>1) h+=`<polyline points="${s.map((e,i)=>X(i)+","+Y(+e.Weight_kg)).join(" ")}" fill="none" stroke="#C97D43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  s.forEach((e,i)=>{ h+=`<circle cx="${X(i)}" cy="${Y(+e.Weight_kg)}" r="4" fill="#C97D43"/>`; });
  h+=`<text x="${px}" y="${H-1}" fill="#9C8E80" font-size="9">${shortD(s[0].Date)}</text>`;
  if(s.length>1) h+=`<text x="${W-px}" y="${H-1}" fill="#9C8E80" font-size="9" text-anchor="end">${shortD(s[s.length-1].Date)}</text>`;
  h+=`</svg>`;
  return h;
}

function renderDone(){
  const isK=PLAN[DET.workout]?.type==="kettle";
  let h=`<div class="pg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div style="font-size:56px;margin-bottom:12px">💪</div>
    <h2 style="font-size:22px;font-weight:800;color:#C97D43;margin:0 0 4px">Saved to Sheet!</h2>
    <p style="font-size:14px;margin:0 0 20px" class="mt">${DET.workout} · ${fd(DET.date)}</p>
    <div style="width:100%;max-width:340px">`;
  DET.exercises.forEach(e=>{ h+=`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1A1613;font-size:13px"><span>${e.name}</span><span style="color:#C97D43;font-weight:600">${e.sets.map(s=>(e.bw||isK)?s.reps:s.kg+"×"+s.reps).join("  ")}</span></div>`; });
  h+=`</div><button class="bc" style="max-width:340px" onclick="cp('${DET.id}')">📋 Copy for Claude</button>
    <button class="bm" onclick="menu()">← Menu</button></div>`;
  return h;
}

function renderModal(){
  let h=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="md"><h3>${MODAL.title}</h3>`;
  if(MODAL.msg) h+=`<p>${MODAL.msg}</p>`;
  (MODAL.fields||[]).forEach(f=>{ h+=`<label>${f.label}</label><input id="f_${f.key}" type="${f.type||'text'}" inputmode="${f.type==='number'?'decimal':'text'}" placeholder="${f.ph||''}" value="${f.val||''}">`; });
  h+=`<div class="mdrow"><button class="mdc" onclick="closeModal()">Cancel</button>
    <button class="${MODAL.danger?'mddanger':'mdok'}" onclick="modalConfirm()">${MODAL.ok||'Save'}</button></div></div></div>`;
  return h;
}

/* ── ACTIONS ── */
function initWorkout(n){
  const w=PLAN[n], p=lastSession(n), isK=w.type==="kettle";
  EX=w.ex.map(e=>({...e}));
  DT={};
  EX.forEach((e,i)=>{
    const slots=isK?1:e.sets, pe=p?.exercises?.find(x=>x.name===e.n);
    DT[i]=Array.from({length:slots},(_,s)=>({kg:pe?.sets?.[s]?.kg??"", reps:pe?.sets?.[s]?.reps??""}));
  });
  WK=n;
}
const loadDraft=()=>{try{return JSON.parse(localStorage.getItem(DRAFT_KEY))}catch{return null}};
const saveDraft=()=>{if(WK)localStorage.setItem(DRAFT_KEY,JSON.stringify({wk:WK,dt:DT,ex:EX}))};
const clearDraft=()=>localStorage.removeItem(DRAFT_KEY);

window.go=function(n){
  const d=loadDraft();
  if(d&&d.wk&&d.wk!==n){ MODAL={title:"Workout in progress",msg:`You have a ${d.wk} in progress. Discard and start ${n}?`,danger:true,ok:"Discard & start",cb:()=>{clearDraft();initWorkout(n);V="go";saveDraft();R();}}; R(); return; }
  if(d&&d.wk===n){ WK=d.wk; DT=d.dt; EX=d.ex; V="go"; R(); return; }
  initWorkout(n); V="go"; saveDraft(); R();
};
window.resume=function(){const d=loadDraft();if(d){WK=d.wk;DT=d.dt;EX=d.ex;V="go";R();}};
window.exitSession=function(){menu();};
window.askDiscard=function(){MODAL={title:"Discard workout?",danger:true,ok:"Discard",cb:()=>{clearDraft();R();}};R();};
window.up=function(ei,si,f,v){if(!DT[ei])DT[ei]=[];if(!DT[ei][si])DT[ei][si]={kg:"",reps:""};DT[ei][si][f]=v;saveDraft();};
window.askAddEx=function(){MODAL={title:"Add exercise",fields:[{key:"name",label:"Name",ph:"Exercise"}],ok:"Add",cb:(v)=>{if(v.name&&v.name.trim()){const isK=PLAN[WK].type==="kettle";EX.push({n:v.name.trim(),sets:3,t:"",added:true,bw:false});DT[EX.length-1]=isK?[{kg:"",reps:""}]:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}];saveDraft();}}};R();};
window.rmEx=function(ei){MODAL={title:"Remove exercise?",danger:true,ok:"Remove",cb:()=>{EX.splice(ei,1);const nd={};EX.forEach((_,i)=>{nd[i]=DT[i<ei?i:i+1]||[{kg:"",reps:""}]});DT=nd;saveDraft();R();}};R();};

window.finish=async function(){
  if(BUSY) return;
  const w=PLAN[WK], isK=w.type==="kettle";
  const payload={ action:"logWorkout", workout:WK, date:today(), sessionId:String(Date.now()),
    exercises:EX.map((x,i)=>({ name:x.n, bw:!!x.bw||isK, sets:DT[i].map(s=>({kg:s.kg===""?0:+s.kg, reps:s.reps===""?0:+s.reps})) })) };
  BUSY=true; R();
  try{
    const res=await apiPost(payload);
    if(res&&res.ok){
      clearDraft();
      await boot(true); // refresh from sheet
      DET=SESSIONS.find(s=>s.id===payload.sessionId) || { workout:WK, date:today(), exercises:payload.exercises.map(e=>({name:e.name,bw:e.bw,sets:e.sets})) };
      BUSY=false; V="done"; R();
    } else { throw new Error(res&&res.error||"save failed"); }
  }catch(err){
    BUSY=false; TT={msg:"⚠ Save failed — draft kept. Retry when online.",err:true}; V="go"; R();
  }
};

window.menu=function(){V="menu";R();};
window.det=function(id){DET=SESSIONS.find(s=>s.id===id);if(DET){V="det";R();}};
window.askDelSession=function(){MODAL={title:"Delete this session?",msg:"Removes it from the Sheet permanently.",danger:true,ok:"Delete",cb:async()=>{try{await apiPost({action:"deleteSession",sessionId:DET.id});await boot(true);V="menu";R();}catch{TT={msg:"⚠ Delete failed",err:true};R();}}};R();};

// menu weight card → weight view; "+ Log weight" button inside → modal
window.openWeight=function(){ V="weight"; R(); };
window.logWeight=function(){ MODAL={title:"Log body weight",fields:[{key:"kg",label:"Weight (kg)",type:"number",ph:"81.5",val:curWeight()||""},{key:"date",label:"Date",type:"date",val:today()}],ok:"Save",cb:async(v)=>{ if(v.kg&&v.date){ try{ await apiPost({action:"logWeight",kg:+v.kg,date:v.date}); await boot(true); TT={msg:"✓ Weight saved"}; }catch{ TT={msg:"⚠ Save failed",err:true}; } R(); } }}; R(); };

window.logNutrition=function(){
  const n=[...DATA.nutrition].sort((a,b)=>String(a.Date).localeCompare(String(b.Date)));
  const t=n.find(x=>String(x.Date).slice(0,10)===today());
  MODAL={title:"Log nutrition — today",fields:[
    {key:"protein",label:"Protein (g)",type:"number",ph:"160",val:t?.Protein_g||""},
    {key:"calories",label:"Calories",type:"number",ph:"2600",val:t?.Calories||""},
    {key:"sleep",label:"Sleep (h)",type:"number",ph:"8",val:t?.Sleep_h||""},
  ],ok:"Save",cb:async(v)=>{ try{ await apiPost({action:"logNutrition",date:today(),protein:v.protein,calories:v.calories,sleep:v.sleep}); await boot(true); TT={msg:"✓ Nutrition saved"}; }catch{ TT={msg:"⚠ Save failed",err:true}; } R(); }};
  R();
};

window.closeModal=function(){MODAL=null;R();};
window.modalConfirm=function(){
  const cb=MODAL.cb; const v={};
  (MODAL.fields||[]).forEach(f=>{const el=document.getElementById("f_"+f.key);v[f.key]=el?el.value:null;});
  MODAL=null; if(cb) cb(v); R();
};

window.genReport=async function(){
  if(BUSY) return;
  BUSY=true; TT={msg:"Generating report…"}; R();
  try{
    const res=await apiPost({action:"buildReport"});
    BUSY=false;
    if(res&&res.ok&&res.text){
      const t=res.text;
      navigator.clipboard.writeText(t).then(()=>{TT={msg:"✓ Report copied — paste in chat"};R();})
        .catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);TT={msg:"✓ Report copied — paste in chat"};R();});
    } else { TT={msg:"⚠ Report failed",err:true}; R(); }
  }catch(err){ BUSY=false; TT={msg:"⚠ Report failed — check connection",err:true}; R(); }
};

window.cp=function(id){
  const s=SESSIONS.find(x=>x.id===id)||DET; if(!s) return;
  const isK=PLAN[s.workout]?.type==="kettle";
  let t=s.workout+" · "+fd(s.date)+"\n";
  s.exercises.forEach(e=>{ t+=e.name+": "+e.sets.map(x=>(e.bw||isK)?x.reps+" reps":x.kg+"kg×"+x.reps).join(" / ")+"\n"; });
  navigator.clipboard.writeText(t).then(()=>{TT={msg:"✓ Copied!"};R();}).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);TT={msg:"✓ Copied!"};R();});
};

/* ── BOOT ── */
async function boot(silent){
  if(!silent){ V="loading"; R(); }
  try{
    DATA = await apiGet();
    DATA.workouts = DATA.workouts||[]; DATA.weight=DATA.weight||[]; DATA.nutrition=DATA.nutrition||[];
    reconstruct();
    if(!silent){ V="menu"; R(); }
  }catch(err){
    if(!silent){ V="error"; R(); }
    else throw err;
  }
}
window.boot=boot;
boot();
</script>
</body>
