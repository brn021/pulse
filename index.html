<!DOCTYPE html>
<html lang="en">

<title>PULSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0D0B09;color:#EDE6DF;font-family:-apple-system,system-ui,sans-serif;min-height:100dvh}
input{-webkit-appearance:none;-moz-appearance:textfield;font-family:inherit}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button{font-family:inherit}
::-webkit-scrollbar{display:none}
.pg{padding:16px;min-height:100dvh;max-width:560px;margin:0 auto}
.sp{padding:12px 12px 110px;max-width:560px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.logo h1{font-size:22px;font-weight:800;letter-spacing:6px}
.dot{width:11px;height:11px;border-radius:50%;background:#C97D43;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,125,67,.55)}70%{box-shadow:0 0 0 11px rgba(201,125,67,0)}100%{box-shadow:0 0 0 0 rgba(201,125,67,0)}}
.phase{margin-left:auto;font-size:12px;color:#9C8E80;font-weight:600}
/* this week: ordered workouts, readable secondary labels */
.wk{background:#1A1613;border-radius:18px;padding:16px 14px 6px;margin-bottom:14px}
.wkh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.wkh .lbl{font-size:11px;font-weight:700;color:#C97D43;letter-spacing:2px;text-transform:uppercase}
.wkh .wkn{font-size:12px;color:#9C8E80;font-weight:600}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:4px;border-radius:2px;background:#2B2520}
.seg i.d{background:#C97D43}.seg i.s{background:#4A4038}
.wkc{font-size:12px;color:#9C8E80;margin:8px 0 6px}
.wrow{display:flex;align-items:center;border-top:1px solid #241E1A}
.wmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 2px;background:none;border:none;color:#EDE6DF;text-align:left;cursor:pointer}
.wn{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:1.5px solid #3A322B;color:#9C8E80}
.wt{flex:1;min-width:0}
.wnm{display:block;font-size:16px;font-weight:700}
.wsub{display:block;font-size:12px;color:#9C8E80;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd{font-size:12px;color:#9C8E80;font-weight:600;text-align:right;white-space:nowrap}
.wd b{display:block;color:#EF8174;font-size:13px;font-weight:800;margin-top:3px}
.wmore{background:none;border:none;color:#9C8E80;font-size:18px;min-width:44px;min-height:44px;flex-shrink:0;padding:12px 6px;cursor:pointer;line-height:1;border-radius:10px}
.wrow.done .wn{background:#C97D4326;border-color:transparent;color:#C97D43}
.wrow.done .wnm{color:#9C8E80}
.wrow.skip .wn{border-style:dashed;color:#9C8E80}
.wrow.skip .wnm{color:#9C8E80;text-decoration:line-through}
.wrow.next{background:#D9483B14;border-radius:12px;border-top-color:transparent;margin:2px -6px;padding:0 6px}
.wrow.next+.wrow{border-top-color:transparent}
.wrow.next .wn{background:#D9483B;border-color:#D9483B;color:#0D0B09}
.wrow.next .wd{color:#9C8E80}
.wrow.next .wmore{color:#9C8E80}
/* bottom sheet: move day / skip */
.ov.sh{align-items:flex-end;padding:0}
.sheet{background:#1A1613;border-radius:20px 20px 0 0;padding:10px 18px max(18px,env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:calc(100dvh - 16px);overflow-y:auto;overscroll-behavior:contain}
.grab{width:36px;height:4px;border-radius:2px;background:#2B2520;margin:0 auto 14px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h3{font-size:18px;font-weight:800}
.sclose{min-width:64px;min-height:44px;padding:8px 10px;border:1px solid #9C8E80;border-radius:10px;background:transparent;color:#EDE6DF;font-size:13px;font-weight:600;cursor:pointer}
.wk button:focus-visible,.draft-actions button:focus-visible,.sheet button:focus-visible,.md[aria-modal="true"] button:focus-visible{outline:2px solid #EDE6DF;outline-offset:2px}
.sheet .ss{font-size:13px;color:#9C8E80;margin:3px 0 16px}
.sheet .sl2{font-size:11px;font-weight:700;color:#9C8E80;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.days button{position:relative;padding:12px 0;border-radius:10px;border:1px solid #2B2520;background:#0D0B09;color:#9C8E80;font-size:12px;font-weight:700;cursor:pointer}
.days button.on{border-color:#C97D43;color:#C97D43;background:#C97D4318}
.days button.td::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#D9483B}
.sbtn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid #2B2520;background:transparent;color:#EDE6DF;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.snote{font-size:11px;color:#9C8E80;text-align:center;margin-top:12px}
.mini{display:flex;gap:8px;margin-bottom:12px}
.mcard{flex:1;background:#1A1613;border:none;border-radius:14px;padding:12px;cursor:pointer;color:#EDE6DF;text-align:left}
.mcard .lbl{font-size:10px;font-weight:700;color:#9C8E80;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.mcard .val{font-size:20px;font-weight:800;color:#C97D43}
.mcard .val small{font-size:12px;font-weight:700}
.mcard .ex{font-size:11px;color:#9C8E80;margin-top:2px}
.bh{width:100%;padding:11px 14px;margin-bottom:6px;background:#1A1613;border:none;border-radius:10px;color:#EDE6DF;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:9px;padding:2px 7px;border-radius:6px;letter-spacing:1px;font-weight:700;vertical-align:middle;margin-left:6px}
.ec{background:#1A1613;border-radius:14px;padding:12px;margin-bottom:10px}
.cue{font-size:12px;color:#9C8E80;background:#1A1613;border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.row{display:flex;align-items:center;gap:6px}
.sl{font-size:12px;width:22px;text-align:center;color:#5A4F45;flex-shrink:0}
.inp{flex:1;min-width:0;height:50px;background:#0D0B09;border:2px solid #2B2520;border-radius:12px;font-size:20px;font-weight:700;text-align:center;outline:none;color:#EDE6DF;width:100%}
.inp:focus{border-color:#C97D43}

.ikg{color:#C97D43}
.irir{flex:0 0 58px;font-size:17px}
.pbtn{flex:0 0 46px;height:50px;border-radius:12px;border:2px solid #2B2520;background:#0D0B09;color:#5A4F45;font-weight:800;font-size:13px;cursor:pointer}
.pbtn.on{border-color:#C97D43;background:#C97D4322;color:#C97D43}
.tm{font-size:10px;color:#6E6257;margin:1px 0 0 28px;min-height:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:8px 11px;border-radius:20px;border:1px solid #2B2520;background:#0D0B09;color:#9C8E80;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{border-color:#C97D43;color:#C97D43;background:#C97D4318}
.lnk{background:none;border:none;color:#9C8E80;font-size:12px;font-weight:600;cursor:pointer;padding:8px 0 0}
.bs{position:fixed;bottom:0;left:0;right:0;padding:10px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0D0B09 25%)}

.bb{background:none;border:none;color:#9C8E80;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:12px}
.bm{margin-top:18px;padding:16px 48px;background:#1A1613;border:2px solid #2B2520;border-radius:14px;color:#EDE6DF;font-size:16px;font-weight:700;cursor:pointer}
.bc{width:100%;padding:15px;background:#1A1613;border:2px solid #C97D4355;border-radius:14px;color:#C97D43;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.bg{width:100%;padding:13px;background:transparent;border:1px solid #2B2520;border-radius:12px;color:#9C8E80;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.badd{width:100%;padding:14px;background:transparent;border:2px dashed #2B2520;border-radius:12px;color:#9C8E80;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.bn{margin-top:14px;width:100%;padding:10px;background:transparent;border:1px solid #C9434333;border-radius:10px;color:#C94343;font-size:12px;cursor:pointer}
.brm{background:none;border:none;color:#7A6E60;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#C97D43;color:#1A1613;padding:10px 24px;border-radius:10px;font-weight:700;font-size:14px;z-index:9999;animation:fo 2.5s forwards;max-width:90%;text-align:center}
.toast.err{background:#C94343;color:#fff}
@keyframes fo{0%,80%{opacity:1}100%{opacity:0}}
.mt{color:#9C8E80}.dm{color:#5A4F45}
.lb{font-size:11px;font-weight:700;color:#9C8E80;text-transform:uppercase;letter-spacing:1.5px;margin:18px 0 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9998;display:flex;align-items:center;justify-content:center;padding:24px}
.md{background:#1A1613;border-radius:16px;padding:20px;width:100%;max-width:360px}
.md h3{font-size:17px;font-weight:700;margin-bottom:8px}
.md p{font-size:14px;color:#9C8E80;margin-bottom:10px}
.md label{font-size:11px;color:#9C8E80;text-transform:uppercase;letter-spacing:1px;display:block;margin:10px 0 4px}
.md input{width:100%;height:50px;background:#0D0B09;border:2px solid #2B2520;border-radius:12px;color:#EDE6DF;font-size:17px;font-weight:700;text-align:center;outline:none}
.md input:focus{border-color:#C97D43}
.mdrow{display:flex;gap:8px;margin-top:16px}
.mdrow button{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.mdc{background:#2B2520;color:#EDE6DF}.mdok{background:#C97D43;color:#1A1613}.mddanger{background:#C94343;color:#fff}
.went{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1A1613;border-radius:10px;margin-bottom:6px;font-size:14px}
.chartbox{background:#1A1613;border-radius:16px;padding:16px;margin-bottom:12px}
.spin{width:34px;height:34px;border:3px solid #2B2520;border-top-color:#C97D43;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:#C97D4318;border:1px solid #C97D4344;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:#E8B98C;line-height:1.45}
.draft-actions{display:flex;gap:8px;margin-top:6px}
.draft-actions button{min-height:44px;padding:8px 14px;border:1px solid #9C8E80;border-radius:10px;background:transparent;color:#EDE6DF;font-size:13px;font-weight:600;cursor:pointer}
.banner.err{background:#C9434318;border-color:#C9434344;color:#F0A0A0}
.md textarea{width:100%;min-height:150px;background:#0D0B09;border:2px solid #2B2520;border-radius:12px;color:#EDE6DF;font-size:13px;padding:10px;outline:none;font-family:ui-monospace,Menlo,monospace}
.md textarea:focus{border-color:#C97D43}
.ftot{background:#1A1613;border-radius:16px;padding:16px;margin-bottom:12px}
.ftot .big{font-size:30px;font-weight:800;color:#C97D43}
.ftot .big small{font-size:14px;color:#9C8E80;font-weight:700}
.bar{height:8px;background:#0D0B09;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:#C97D43;border-radius:6px}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#1A1613;border-radius:10px;margin-bottom:6px;font-size:14px}
.fitem .it{flex:1;min-width:0}
.fitem .nm{overflow-wrap:anywhere}
.fitem .mc{font-size:12px;color:#9C8E80;margin-top:2px}
.fav{display:inline-flex;flex-direction:column;align-items:flex-start;padding:9px 12px;border-radius:12px;border:1px solid #2B2520;background:#0D0B09;color:#EDE6DF;font-size:13px;font-weight:600;cursor:pointer;margin:0 6px 6px 0;text-align:left;max-width:100%}
.fav span{font-size:11px;color:#9C8E80;font-weight:500;margin-top:2px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.dnav button{background:#1A1613;border:none;color:#EDE6DF;width:44px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
.pill{display:inline-block;background:#0D0B09;border-radius:8px;padding:6px 10px;font-size:13px;margin:0 6px 6px 0}
</style>
</head>

<script>

/* ── HELPERS ── */
const pad=n=>String(n).padStart(2,"0");
const localDate=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>localDate();
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const parseD=s=>{const p=String(s).slice(0,10).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return localDate(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const weekStart=(s=today())=>addDays(s,-parseD(s).getDay()); // the Sunday that opens the week
const fd=s=>{const d=parseD(s);return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];};
const shortD=s=>{const d=parseD(s);return d.getDate()+"/"+(d.getMonth()+1);};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colorOf=w=>PLAN[w]?.c||"#8B7B6B";
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;

function apiUrl(){
  if(API_URL.indexOf("PASTE_")!==0) return API_URL;
  try{return localStorage.getItem(URL_KEY)||"";}catch{return "";}
}
async function apiGet(){ const r=await fetch(apiUrl(),{method:"GET"}); return r.json(); }
async function apiPost(payload){
  const r=await fetch(apiUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  return r.json();
}

/* ── DATA ── */
function reconstruct(){
  const map={}, hide=new Set(loadPending());
  DATA.workouts.forEach(row=>{
    const sid=String(row.SessionID);
    if(hide.has(sid)) return; // replaced by an edit; removal from the Sheet is pending
    if(!map[sid]) map[sid]={id:sid,date:String(row.Date).slice(0,10),workout:String(row.Workout),ex:{},order:[]};
    const S=map[sid], n=String(row.Exercise);
    if(!S.ex[n]){S.ex[n]={name:n,bw:row.BW==="Y",sets:[]};S.order.push(n);}
    S.ex[n].sets.push({kg:row.Weight,reps:row.Reps,rir:row.RIR??"",time:row.Time||"",note:String(row.Note||"")});
  });
  SESSIONS=Object.values(map).map(s=>({...s,exercises:s.order.map(n=>s.ex[n])}))
    .sort((a,b)=>a.date.localeCompare(b.date)||(parseInt(a.id)||0)-(parseInt(b.id)||0));
}
// when editing a saved session, "previous" means the sessions before it
function exEnd(){
  if(CUR&&CUR.editId){ const i=SESSIONS.findIndex(s=>s.id===CUR.editId); if(i>=0) return i; }
  return SESSIONS.length;
}
// most recent performance of an exercise, in any workout (before index `end`)
function lastEx(name,aka,end){
  const names=[name].concat(aka||[]);
  for(let i=(end==null?exEnd():end)-1;i>=0;i--){
    const e=SESSIONS[i].exercises.find(x=>names.includes(x.name));
    if(e) return {date:SESSIONS[i].date,ex:e};
  }
  return null;
}
function doneOn(w,date){ return SESSIONS.some(s=>s.workout===w&&s.date===date); }
function weekSkipKey(w){ return weekStart()+"|"+w; }
function loadSkips(){ try{return JSON.parse(localStorage.getItem(SKIPS_KEY))||{};}catch{return {};} }
function skippedThisWeek(w){ return loadSkips()[weekSkipKey(w)]===true; }
function loadMoves(){ try{return JSON.parse(localStorage.getItem(MOVES_KEY))||{};}catch{return {};} }
function movedDay(w){ const v=loadMoves()[weekSkipKey(w)]; return Number.isInteger(v)&&v>=0&&v<=6?v:null; }
/* This week, in order. Done workouts sit on the day they were done; the rest on their planned
   (or moved) day. "Next" is the first one neither done nor skipped, so a missed workout stays
   next until it is done or skipped. Future-dated sessions stay in history, but do not
   count as completed until their local calendar date arrives. */
function weekPlan(){
  const t=today(), ws=weekStart(t);
  const items=ACTIVE_WORKOUTS.map((w,i)=>{
    const ss=SESSIONS.filter(s=>s.workout===w&&s.date>=ws&&s.date<=t);
    const done=ss.length?ss[ss.length-1]:null, pd=PLAN_DAY[w], md=movedDay(w);
    return {w,i,done,skipped:!done&&skippedThisWeek(w),planDay:pd,moved:!done&&md!=null&&md!==pd,
      day:done?parseD(done.date).getDay():(md!=null?md:pd)};
  }).sort((a,b)=>a.day-b.day||a.i-b.i);
  const next=items.find(x=>!x.done&&!x.skipped)||null;
  items.forEach((x,k)=>{ x.n=k+1; x.next=x===next; });
  return {items,next};
}
function blockWeek(){ return Math.floor(daysBetween(weekStart(BLOCK_START),today())/7)+1; }
function weights(){ return DATA.weight.map(r=>({d:String(r.Date).slice(0,10),kg:num(r.Weight_kg),waist:num(r.Waist_cm)})).sort((a,b)=>a.d.localeCompare(b.d)); }
function avg7(){
  const t=today(), from=addDays(t,-6);
  const v=weights().filter(x=>x.kg!=null&&x.d>=from&&x.d<=t).map(x=>x.kg);
  return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null;
}
function latest(arr,key){ const v=arr.filter(x=>x[key]!=null); return v.length?v[v.length-1]:null; }
function foods(){
  return (DATA.food||[]).map(r=>({id:String(r.EntryID),d:String(r.Date).slice(0,10),t:String(r.Time||""),meal:String(r.Meal||""),item:String(r.Item||""),k:num(r.Kcal),p:num(r.Protein_g),c:num(r.Carbs_g),f:num(r.Fat_g),src:String(r.Source||"")}));
}
function dayTotals(d){
  const L=foods().filter(x=>x.d===d), sm=k=>L.reduce((a,x)=>a+(x[k]||0),0);
  return {n:L.length,k:sm("k"),p:sm("p"),c:sm("c"),f:sm("f")};
}
function favourites(){
  const g={};
  foods().forEach(x=>{ const key=x.item.trim().toLowerCase(); if(!key) return; const o=g[key]||(g[key]={n:0,last:null}); o.n++; if(!o.last||(x.d+x.t)>=(o.last.d+o.last.t)) o.last=x; });
  return Object.values(g).sort((a,b)=>b.n-a.n||(b.last.d+b.last.t).localeCompare(a.last.d+a.last.t)).slice(0,14).map(o=>o.last);
}
function kcalTarget(){ try{return num(localStorage.getItem(KCAL_KEY));}catch{return null;} }
function mealByTime(){ const h=new Date().getHours(); return h<11?"Breakfast":h<15?"Lunch":h<18?"Snack":"Dinner"; }
const r0=v=>Math.round(v||0);
function curProtein(){ const n=[...DATA.nutrition].sort((a,b)=>String(a.Date).localeCompare(String(b.Date))); const t=n.find(x=>String(x.Date).slice(0,10)===today()); return t?num(t.Protein_g):null; }

/* ── DRAFTS (several at once, e.g. pull-ups spread over the day + a gym session) ── */
function loadDrafts(){ try{return JSON.parse(localStorage.getItem(DRAFTS_KEY))||{};}catch{return {};} }
function saveDrafts(d){ try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(d));}catch{} }
const editKey=id=>"edit:"+id;
const dKey=c=>c.editId?editKey(c.editId):c.wk; // edits of saved sessions never collide with a new workout's draft
function saveCur(){ if(!CUR) return; const d=loadDrafts(); d[dKey(CUR)]=CUR; saveDrafts(d); }
function dropDraft(w){ const d=loadDrafts(); delete d[w]; saveDrafts(d); }
function loadPending(){ try{return JSON.parse(localStorage.getItem(PENDING_DEL_KEY))||[];}catch{return [];} }
function savePending(a){ try{localStorage.setItem(PENDING_DEL_KEY,JSON.stringify(a));}catch{} }

function newExercise(e,end){
    const L=lastEx(e.n,e.aka,end);
    const lastKg = L ? (L.ex.sets.map(s=>num(s.kg)).filter(v=>v!=null).pop() ?? null) : null;
    const kg = e.fixedLoad ? e.defKg : lastKg!=null ? lastKg : (e.defKg!=null?e.defKg:"");
    const lastSets = L?L.ex.sets:[];
    return {...e, ps:e.sets, kg:e.oneKg?kg:"", note:"", limit:"", sets:Array.from({length:e.sets},(_,i)=>({
      kg:e.oneKg||e.bw?"":kg, reps:"", rir:"", time:"",
      p: e.press ? (()=>{ const ln=lastSets[i]?.note||""; return /no press/.test(ln) ? false : /(^|\|)\s*press/.test(ln) ? true : i<(e.pressDefault||1); })() : false,
      last: lastSets[i] ? lastSets[i].reps : ""
    }))};
}
function newSession(w){
  return {wk:w,date:today(),planVersion:PLAN_NAME,ex:PLAN[w].ex.map(e=>newExercise(e))};
}

/* ── EDIT A SAVED SESSION ── turns it back into an editable draft */
function sessionToDraft(S){
  const idx=SESSIONS.findIndex(s=>s.id===S.id), end=idx<0?SESSIONS.length:idx;
  const planEx=PLAN[S.workout]?.ex||[];
  // current-plan sessions also show the plan's unlogged exercises, so a forgotten one can be filled in
  const current=S.date>=BLOCK_START&&ACTIVE_WORKOUTS.includes(S.workout);
  const matches=(o,n)=>o.n===n||(o.aka||[]).includes(n);
  const used=new Set();
  const findSaved=def=>{
    for(const o of (def.choice?EXERCISE_CHOICES[def.choice]:[def])){
      const se=S.exercises.find(x=>!used.has(x.name)&&matches(o,x.name));
      if(se) return {se,def:o};
    }
    return null;
  };
  const fromSaved=(se,def)=>{
    const d=def||{n:se.name,sets:se.sets.length,t:""};
    const e={...d, n:se.name, ps:d.sets||0, bw:!!se.bw, kg:"", note:"", limit:"", added:!def&&current};
    if(e.oneKg){
      const ks=se.sets.map(s=>num(s.kg));
      if(ks.every(k=>k!=null&&k===ks[0])) e.kg=ks[0]; else e.oneKg=false; // keep per-set loads if they differed
    }
    if(se.sets.some(s=>s.rir!==""&&s.rir!=null)) e.rir=true;
    // split saved notes into what this screen regenerates and what must be kept as written
    const left=se.sets.map(s=>{
      const keep=[]; let p=false;
      String(s.note||"").split("|").map(x=>x.trim()).filter(Boolean).forEach(x=>{
        if(e.interval&&/^circuit:/.test(x)) return;
        if(e.assist&&x==="assist") return;
        if(e.press&&(x==="press"||x==="no press")){ p=x==="press"; return; }
        if(e.limiter&&/^limit: /.test(x)){ const L=LIMITS.find(l=>l.toLowerCase()===x.slice(7)); if(L){ e.limit=L; return; } }
        keep.push(x);
      });
      return {keep,p};
    });
    const common=left.length?left[0].keep.filter(x=>left.every(l=>l.keep.includes(x))):[];
    e.note=common.join(" | ");
    e.sets=se.sets.map((s,i)=>({kg:e.oneKg||e.bw?"":(s.kg??""), reps:s.reps??"", rir:s.rir??"", time:s.time||"", p:left[i].p, last:"",
      extra:left[i].keep.filter(x=>!common.includes(x))}));
    // show the planned number of rows, so a forgotten set can be filled in
    const L=lastEx(e.n,e.aka,end);
    for(let i=e.sets.length;i<e.ps;i++) e.sets.push({kg:e.oneKg||e.bw?"":(e.sets[i-1]?.kg??""),reps:"",rir:"",time:"",p:false,last:L?.ex.sets[i]?.reps??""});
    return e;
  };
  const ex=[];
  if(current) planEx.forEach(def=>{
    const m=findSaved(def);
    if(m){ used.add(m.se.name); ex.push(fromSaved(m.se,m.def)); }
    else ex.push(newExercise(def,end));
  });
  S.exercises.forEach(se=>{
    if(used.has(se.name)) return;
    const m=planEx.map(d=>findSaved(d)).find(x=>x&&x.se===se);
    ex.push(fromSaved(se,m?.def));
  });
  return {wk:S.workout,date:S.date,planVersion:PLAN_NAME,editId:S.id,ex};
}

/* ── RENDER ── */
function R(){
  const $=document.getElementById("app");
  const focusedId=document.activeElement?.id;
  if(TT){ clearTimeout(R._t); R._t=setTimeout(()=>{TT=null;R();},2500); }
  const modalHtml=MODAL?renderModal():SHEET&&V==="menu"?renderSheet():"";
  const toastHtml=TT?`<div class="toast ${TT.err?"err":""}">${esc(TT.msg)}</div>`:"";
  let h="";
  if(!apiUrl()) h=renderSetup();
  else if(V==="loading") h=`<div class="pg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div class="logo" style="margin:0"><div class="dot"></div><h1>PULSE</h1></div><div class="spin"></div><p style="font-size:13px" class="mt">Syncing with the Sheet…</p></div>`;
  else if(V==="error") h=`<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1></div><div class="banner err">Couldn't reach the Sheet. Check your connection and the Apps Script URL.</div><button class="bc" onclick="boot()">Try again</button><button class="bg" onclick="resetUrl()">Change Apps Script URL</button></div>`;
  else if(V==="menu") h=renderMenu();
  else if(V==="go"&&CUR) h=renderSession();
  else if(V==="det"&&DET) h=renderDetail();
  else if(V==="weight") h=renderWeight();
  else if(V==="done"&&DET) h=renderDone();
  else if(V==="plan") h=renderPlan();
  else if(V==="food") h=renderFood();
  $.innerHTML=h+modalHtml+toastHtml;
  const dialog=weeklyDialog();
  if(dialog){
    // Keep keyboard and screen-reader navigation inside workout options and confirmations.
    $.firstElementChild.inert=true;
    if(MODAL){ dialog.setAttribute("role","dialog"); dialog.setAttribute("aria-modal","true"); dialog.setAttribute("aria-label",MODAL.title); }
    const previous=focusedId&&document.getElementById(focusedId);
    (previous&&dialog.contains(previous)?previous:dialog.querySelector("button"))?.focus({preventScroll:true});
  }else if(SHEET_RETURN){
    const target=document.getElementById(SHEET_RETURN); SHEET_RETURN=null;
    target?.focus({preventScroll:true});
  }else if(focusedId?.startsWith("week-options-")){
    document.getElementById(focusedId)?.focus({preventScroll:true});
  }
}

function renderSetup(){
  return `<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1></div>
  <div class="banner">Paste your Apps Script web app URL (ends in <b>/exec</b>). It's saved on this phone.</div>
  <input id="urlIn" class="inp" style="font-size:14px;height:54px" placeholder="https://script.google.com/macros/s/…/exec">
  <button class="bc" onclick="saveUrl()">Connect</button></div>`;
}

function renderMenu(){
  const t=today(), drafts=loadDrafts();
  let h=`<div class="pg"><div class="logo"><div class="dot"></div><h1>PULSE</h1><span class="phase">${PLAN_NAME}</span></div>`;

  const {items}=weekPlan();
  h+=renderWeek(items,drafts);
  Object.keys(drafts).filter(w=>PLAN[w]&&!drafts[w]?.editId).forEach(w=>{
    h+=`<div class="banner draft-banner">${esc(w)} in progress.<div class="draft-actions"><button onclick="go('${w}')" aria-label="Resume ${esc(w)}">Resume</button><button id="draft-discard-${Object.keys(PLAN).indexOf(w)}" onclick="askDiscard('${w}')" aria-label="Discard ${esc(w)} draft">Discard</button></div></div>`;
  });
  Object.values(drafts).filter(d=>d&&d.editId&&SESSIONS.some(s=>s.id===d.editId)).forEach(d=>{
    h+=`<div class="banner">Unsaved changes to ${esc(d.wk)} · ${fd(d.date)}. <span style="text-decoration:underline;cursor:pointer" onclick="editSession('${d.editId}')">Resume</span> · <span style="text-decoration:underline;cursor:pointer" onclick="askDiscardEdit('${d.editId}')">Discard</span></div>`;
  });

  // WEIGHT + PROTEIN
  const W=weights(), lw=latest(W,"kg"), a7=avg7(), cp=curProtein();
  h+=`<div class="mini">
    <button class="mcard" onclick="openWeight()"><div class="lbl">Weight</div><div class="val">${lw?lw.kg:"–"}<small> kg</small></div><div class="ex">${a7!=null?"7-day avg "+a7.toFixed(1):"tap to log"}</div></button>
    <button class="mcard" onclick="openFood()"><div class="lbl">Food today</div>${(()=>{const T=dayTotals(t);return T.n?`<div class="val">${r0(T.k)}<small> kcal</small></div><div class="ex">${r0(T.p)}g protein</div>`:`<div class="val">${cp!=null?cp+'<small> g P</small>':"–"}</div><div class="ex">tap to log</div>`;})()}</button></div>`;
  h+=`<button class="bc" style="margin-top:0" onclick="genReport()" ${BUSY?"disabled":""}>📋 Copy training report</button>`;

  h+=`<button class="bg" onclick="V='plan';R();window.scrollTo(0,0)">View the full plan</button>`;

  // HISTORY
  h+=`<p class="lb">History</p>`;
  if(!SESSIONS.length) h+=`<p style="font-size:13px" class="dm">No sessions yet</p>`;
  [...SESSIONS].reverse().slice(0,15).forEach(s=>{
    h+=`<button class="bh" onclick="det('${s.id}')"><span><span style="font-weight:700;color:${colorOf(s.workout)}">${esc(s.workout)}</span><span style="font-size:12px;margin-left:8px" class="mt">${fd(s.date)}</span></span><span class="dm">→</span></button>`;
  });
  h+=`</div>`;
  return h;
}

function renderWeek(items,drafts){
  const dn=items.filter(x=>x.done).length, sk=items.filter(x=>x.skipped).length, N=items.length;
  let h=`<div class="wk"><div class="wkh"><span class="lbl">This week</span><span class="wkn">Week ${Math.max(1,blockWeek())}</span></div>`;
  h+=`<div class="seg">${items.map((x,k)=>`<i class="${k<dn?"d":k<dn+sk?"s":""}"></i>`).join("")}</div>`;
  h+=`<div class="wkc">${dn} of ${N} done${sk?` · ${sk} skipped`:""}${dn+sk===N?" · week covered":""}</div>`;
  items.forEach(x=>{
    const P=PLAN[x.w], dr=!x.done&&drafts[x.w];
    const cls=x.done?"done":x.skipped?"skip":x.next?"next":"";
    const act=x.done?`det('${x.done.id}')`:`go('${x.w}')`;
    const sub=x.skipped?"Skipped this week":(dr?`<span style="color:#C97D43">In progress</span> · `:"")+esc(P.sub);
    h+=`<div class="wrow ${cls}"><button class="wmain" onclick="${act}"><span class="wn">${x.done?"✓":x.n}</span>`+
      `<span class="wt"><span class="wnm">${esc(x.w)}</span><span class="wsub">${sub}</span></span>`+
      `<span class="wd">${DAY3[x.day]}${x.next?`<b>${dr?"Resume":"Start"} →</b>`:""}</span></button>`+
      `<button id="week-options-${x.i}" class="wmore" onclick="openSheet('${x.w}')" aria-label="Options for ${esc(x.w)}" aria-haspopup="dialog" aria-controls="week-options" aria-expanded="${SHEET?.w===x.w&&!MODAL}">⋯</button></div>`;
  });
  return h+`</div>`;
}

function renderSheet(){
  const x=weekPlan().items.find(i=>i.w===SHEET.w); if(!x) return "";
  const td=parseD(today()).getDay(), w=x.w;
  const sub=x.done?`Done on ${DAYN[x.day]}`:x.skipped?`Skipped this week · planned for ${DAYN[x.planDay]}`
    :x.moved?`Moved to ${DAYN[x.day]} this week · planned for ${DAYN[x.planDay]}`:`Planned for ${DAYN[x.planDay]}`;
  let h=`<div class="ov sh" onclick="if(event.target===this)closeSheet()"><div id="week-options" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-description"><div class="grab" aria-hidden="true"></div><div class="sheethead"><h3 id="sheet-title">${esc(w)}</h3><button id="sheet-close" class="sclose" onclick="closeSheet()">Close</button></div><div id="sheet-description" class="ss">${sub}</div>`;
  const draft=loadDrafts()[w];
  if(draft&&!draft.editId){
    h+=`<button class="sbtn" onclick="sheetDo('go','${w}')">Resume workout</button>`;
    h+=`<button class="sbtn" onclick="sheetDo('discard','${w}')">Discard draft</button>`;
  }
  if(x.done){
    h+=`<button class="sbtn" onclick="sheetDo('det','${x.done.id}')">Open session</button>`;
    if(!draft) h+=`<button class="sbtn" style="color:#9C8E80" onclick="sheetDo('go','${w}')">Start again</button>`;
  }else if(x.skipped){
    h+=`<button class="sbtn" onclick="sheetDo('skip','${w}')">Undo skip</button>`;
    h+=`<div class="snote">Applies to this week only, on this device.</div>`;
  }else{
    h+=`<div class="sl2">Move this week to</div><div class="days">`;
    [0,1,2,3,4,5,6].forEach(d=>{ h+=`<button id="sheet-day-${d}" class="${d===x.day?"on":""} ${d===td?"td":""}" aria-label="${DAYN[d]}" aria-pressed="${d===x.day}" ${d===td?'aria-current="date"':""} onclick="moveTo('${w}',${d})">${DAY3[d]}</button>`; });
    h+=`</div><button class="sbtn" onclick="sheetDo('skip','${w}')">Skip this week</button>`;
    h+=`<div class="snote">Applies to this week only, on this device.</div>`;
  }
  return h+`</div></div>`;
}

function renderPlan(){
  let h=`<div class="pg"><button class="bb" onclick="menu()">← back</button><h2 style="font-size:20px;font-weight:800;margin-bottom:12px">${PLAN_NAME} — the week</h2>`;
  [0,1,2,3,4,5,6].forEach(d=>{
    h+=`<div class="went"><span class="mt">${DAYN[d]}</span><span style="text-align:right;font-weight:600">${WEEK[d].length?WEEK[d].map(w=>`<span style="color:${PLAN[w].c}">${w}</span>`).join("<br>"):'<span class="dm">rest</span>'}</span></div>`;
  });
  h+=`<div class="banner">Thursday is the home session; Friday is a fallback. Keep 1–3 reps in reserve. Increase load after reaching the top of the rep range with good form.</div>`;
  ACTIVE_WORKOUTS.forEach(n=>{ const P=PLAN[n];
    h+=`<p class="lb" style="color:${P.c}">${n} · ${P.day}</p><div class="ec">`;
    if(P.cue) h+=`<details class="cue"><summary>Session notes</summary>${esc(P.cue)}</details>`;
    if(P.sources) h+=sourceLinks(P);

function setStr(e,s){
  let t=e.bw?String(s.reps):((num(s.kg)??"?")+"kg×"+s.reps);
  const n=String(s.note||"");
  if(/no press/.test(n)) t+=" (squat only)"; else if(/(^|\|)\s*press/.test(n)) t+=" +P";
  if(s.rir!==""&&s.rir!=null) t+=" RIR"+s.rir;
  if(s.time) t+=" @"+s.time;
  return t;
}
function exNotes(e){
  const o={};
  e.sets.forEach(s=>String(s.note||"").split("|").map(x=>x.trim()).filter(x=>x&&!/press/.test(x)&&x!=="assist").forEach(x=>o[x]=1));
  return Object.keys(o);
}

function weightChart(s){
  if(!s.length) return `<p style="font-size:13px;text-align:center;padding:20px 0" class="dm">No weight data</p>`;
  const vals=s.map(e=>e.kg), min=Math.min(...vals), max=Math.max(...vals);
  const pd=(max-min)<1?1:(max-min)*.15, lo=min-pd, hi=max+pd;
  const Wd=300,H=130,px=22,py=12;
  const X=i=>s.length===1?Wd/2:px+i*(Wd-px-8)/(s.length-1);
  const Y=v=>H-py-(v-lo)*(H-2*py)/(hi-lo);
  let h=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto">`;
  h+=`<text x="0" y="${Y(max)+3}" fill="#9C8E80" font-size="9">${max}</text><text x="0" y="${Y(min)+3}" fill="#9C8E80" font-size="9">${min}</text>`;
  if(s.length>1) h+=`<polyline points="${s.map((e,i)=>X(i)+","+Y(e.kg)).join(" ")}" fill="none" stroke="#C97D43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  s.forEach((e,i)=>{ h+=`<circle cx="${X(i)}" cy="${Y(e.kg)}" r="3.5" fill="#C97D43"/>`; });
  h+=`<text x="${px}" y="${H-1}" fill="#9C8E80" font-size="9">${shortD(s[0].d)}</text>`;
  if(s.length>1) h+=`<text x="${Wd-8}" y="${H-1}" fill="#9C8E80" font-size="9" text-anchor="end">${shortD(s[s.length-1].d)}</text>`;
  return h+`</svg>`;
}

function parseFood(text, defDate){
  const out=[];
  String(text||"").split(/\r?\n/).forEach(line=>{
    const l=line.trim().replace(/^[-*•>`\s]+/,"");
    if(!/^FOOD\s*\|/i.test(l)) return;
    const p=l.split("|").map(x=>x.trim());
    if(p.length<6) return;
    const k=parseFloat(p[4]); if(isNaN(k)) return;
    const pr=parseFloat(p[5]), cb=parseFloat(p[6]), ft=parseFloat(p[7]);
    const mm=MEALS.find(m=>m.toLowerCase()===String(p[2]).toLowerCase());
    out.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), date:/^\d{4}-\d{2}-\d{2}$/.test(p[1])?p[1]:defDate, time:nowTime(),
      meal:mm||p[2]||"Snack", item:p[3]||"Item", kcal:k, protein:isNaN(pr)?"":pr, carbs:isNaN(cb)?"":cb, fat:isNaN(ft)?"":ft, source:"claude"});
  });
  return out;
}

const UNCONFIRMED=" Its last save couldn't be confirmed: tap Save to check it instead, or discarding will also remove anything that reached the Sheet.";

};

window.askAddEx=function(){ MODAL={title:"Add exercise",msg:"Enter an exercise name and number of sets.",fields:[{key:"name",label:"Name",ph:"Exercise"},{key:"sets",label:"Sets",type:"number",val:"3"}],ok:"Add",cb:v=>{ const n=(v.name||"").trim(); if(!n) return; const k=Math.max(1,Math.min(6,+v.sets||3)); const L=lastEx(n); const lk=L?(L.ex.sets.map(s=>num(s.kg)).filter(x=>x!=null).pop()??""):""; CUR.ex.push({n, ps:k, t:"", added:true, bw:false, kg:"", note:"", limit:"", sets:Array.from({length:k},(_,i)=>({kg:lk,reps:"",rir:"",time:"",p:false,last:L?.ex.sets[i]?.reps??""}))}); saveCur(); }}; R(); };
window.rmEx=function(ei){ MODAL={title:"Remove "+CUR.ex[ei].n+"?",danger:true,ok:"Remove",cb:()=>{CUR.ex.splice(ei,1); saveCur();}}; R(); };

function buildPayload(c=CUR){
  const exercises=[], skipped=[];
  c.ex.forEach(e=>{
    const sets=[];
    e.sets.forEach(s=>{
      if(num(s.reps)==null||+s.reps<=0) return;
      const notes=[];
      if(e.interval) notes.push("circuit: 30s work / 30s rest; reps are actual repetitions");
      if(e.assist&&num(s.kg)) notes.push("assist");
      if(e.press) notes.push(s.p?"press":"no press");
      if(e.limit) notes.push("limit: "+e.limit.toLowerCase());
      if(e.note) notes.push(e.note);
      if(s.extra&&s.extra.length) notes.push(...s.extra); // set-specific notes kept from a saved session
      sets.push({ kg: e.bw?"":(e.oneKg?(num(e.kg)??""):(num(s.kg)??"")), reps:+s.reps, rir:num(s.rir)??"", time:s.time||"", note:notes.join(" | ") });
    });
    if(sets.length) exercises.push({name:e.n,bw:!!e.bw,sets}); else skipped.push(e.n);
  });
  return {exercises,skipped};
}

// Remove old copies of edited sessions. Safe to call any time: an id that is already gone is a no-op.
async function flushPending(){
  for(const id of loadPending()){ try{ await apiPost({action:"deleteSession",sessionId:id}); }catch{} }
}
// After a fetch, forget pending ids the Sheet no longer has.
function prunePending(){
  const ids=new Set(DATA.workouts.map(r=>String(r.SessionID)));
  const p=loadPending(), keep=p.filter(id=>ids.has(id));
  if(keep.length!==p.length) savePending(keep);
  return keep.length;
}

/* ── SAVING ──
   Each save attempt gets a session id that is stored in the draft BEFORE the request goes out
   (draft.op). If the reply is lost, the draft keeps that id, and the next Save asks the Sheet
   whether those rows arrived before sending anything — so a retry never writes a second copy.
   Copies this phone created that should not survive (an outdated or partial attempt, or the
   original of an edited session) are listed in draft.drop and removed only after the new
   version is confirmed in the Sheet. */
const RESEND_WAIT_MS=20000; // a request that just failed may still be finishing on the server
const draftSig=c=>JSON.stringify([c.wk,c.date,buildPayload(c).exercises]);
const setCount=ex=>ex.reduce((a,e)=>a+e.sets.length,0);
const rowsIn=(workouts,id)=>workouts.filter(r=>String(r.SessionID)===id).length;
async function countRows(id){ const d=await apiGet(); return rowsIn(d.workouts||[],id); }
function queueDelete(ids){ const p=loadPending(); savePending(p.concat(ids.filter(x=>x&&!p.includes(x)))); }

window.finish=async function(){
  if(BUSY||!CUR) return;
  const {exercises,skipped}=buildPayload();
  if(!exercises.length){ TT={msg:CUR.editId?"Nothing logged. To remove the workout, delete it instead.":"Nothing logged yet — enter reps first",err:true}; R(); return; }
  const sig=draftSig(CUR), n=setCount(exercises);
  const stop=msg=>{ BUSY=false; TT={msg,err:true}; R(); };
  BUSY=true; R();

  // 1. An earlier attempt whose reply never came: find out what reached the Sheet first.
  if(CUR.op){
    let rows;
    try{ rows=await countRows(CUR.op.id); }catch{ return stop("⚠ No connection. Nothing was sent; your workout is kept on this phone."); }
    if(rows===CUR.op.n&&CUR.op.sig===sig) return saved(CUR.op.id,exercises,skipped); // it arrived; don't send again
    if(rows===0&&Date.now()-CUR.op.at<RESEND_WAIT_MS) return stop("Still checking the last save. Try again in a few seconds.");
    CUR.drop=(CUR.drop||[]).concat(CUR.op.id); // partial, outdated or never arrived: replace it, and clean up if it lands late
    CUR.op=null; saveCur();
  }

  // 2. Send with an id fixed before the request leaves. Edits keep the original's timestamp so same-day order holds.
  const base=CUR.editId?parseInt(CUR.editId):NaN;
  CUR.op={id:(isNaN(base)?Date.now():base)+"-"+Math.random().toString(36).slice(2,6),sig,n,at:Date.now()};
  saveCur();
  let ok=false;
  try{ const r=await apiPost({action:"logWorkout",workout:CUR.wk,date:CUR.date,sessionId:CUR.op.id,exercises}); ok=!!(r&&r.ok); }catch{}
  if(!ok){ try{ ok=(await countRows(CUR.op.id))===n; }catch{} } // the reply may be lost while the write succeeded
  if(!ok) return stop("⚠ Couldn't confirm the save. It's kept on this phone; Save again checks the Sheet first, so it won't be saved twice.");
  return saved(CUR.op.id,exercises,skipped);
};

// The new version is confirmed in the Sheet: retire the copies it replaces, then show it.
async function saved(id,exercises,skipped){
  const edit=!!CUR.editId, w=CUR.wk, date=CUR.date;
  const replaced=[CUR.editId].concat(CUR.drop||[]).filter(Boolean);
  if(replaced.length) queueDelete(replaced); // hidden in the app straight away
  dropDraft(dKey(CUR)); CUR=null;
  if(replaced.length) await flushPending();
  let left=false;
  try{ await boot(true); const p=loadPending(); left=replaced.some(x=>p.includes(x)); }catch{ left=replaced.length>0; }
  DET=SESSIONS.find(s=>s.id===id)||{id,workout:w,date,exercises:exercises.map(e=>({name:e.name,bw:e.bw,sets:e.sets}))};
  if(edit){ V="det"; TT=left?{msg:"✓ Saved. Old version will be cleared on next sync."}:{msg:"✓ Changes saved"}; }
  else{ DET.skipped=skipped; V="done"; if(left) TT={msg:"✓ Saved. An extra copy will be cleared on next sync."}; }
  BUSY=false; R(); window.scrollTo(0,0);
}

// On app open: a draft whose last save did reach the Sheet (reply lost, app closed) is finished
// here instead of waiting for another tap. Returns how many were settled.
function settleDrafts(){
  const d=loadDrafts(); let n=0;
  Object.keys(d).forEach(k=>{
    const c=d[k]; if(!c||!c.op||(CUR&&dKey(CUR)===k)) return;
    if(rowsIn(DATA.workouts,c.op.id)===c.op.n&&c.op.sig===draftSig(c)){
      queueDelete([c.editId].concat(c.drop||[]).filter(Boolean)); delete d[k]; n++;
    }
  });
  if(n) saveDrafts(d);
  return n;
}
// Copies this phone may have written for a draft that is now being thrown away.
function discardCopies(c){
  const ids=c?[c.op&&c.op.id].concat(c.drop||[]).filter(Boolean):[];
  if(ids.length){ queueDelete(ids); flushPending().catch(()=>{}); }
}

function copyText(t,msg){
  const ok=()=>{TT={msg};R();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(fallback); else fallback();
  function fallback(){ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch{} document.body.removeChild(a); ok(); }
}

window.cp=function(id){

  let t=s.workout+" · "+fd(s.date)+"\n";
  s.exercises.forEach(e=>{
    const assist=e.sets.some(x=>/assist/.test(x.note));
    const ns=exNotes(e);
    t+=e.name+(assist?" (kg = assistance)":"")+": "+e.sets.map(x=>setStr(e,x)).join(" / ")+(ns.length?" ["+ns.join("; ")+"]":"")+"\n";
  });
  if(s.skipped&&s.skipped.length) t+="Not done: "+s.skipped.join(", ")+"\n";
  copyText(t,"✓ Copied");
};

/* ── BOOT ── */
async function boot(silent){
  if(!apiUrl()){ R(); return; }
  if(!silent){ V="loading"; R(); }
  try{
    DATA=await apiGet();
    DATA.workouts=DATA.workouts||[]; DATA.weight=DATA.weight||[]; DATA.nutrition=DATA.nutrition||[]; DATA.food=DATA.food||[];
    let pending=prunePending();
    const settled=silent?0:settleDrafts();
    if(settled){ pending=loadPending().length; TT={msg:"✓ "+(settled>1?settled+" earlier saves":"Earlier save")+" confirmed in the Sheet"}; }
    reconstruct();
    // drop unsaved edits whose session no longer exists (deleted, or edited on another device)
    const d=loadDrafts(); let ch=false;
    Object.keys(d).forEach(k=>{ if(d[k]&&d[k].editId&&!SESSIONS.some(s=>s.id===d[k].editId)&&!(CUR&&CUR.editId===d[k].editId)){ delete d[k]; ch=true; } });
    if(ch) saveDrafts(d);
    if(!silent){ V="menu"; R(); }
    if(pending&&!silent) flushPending().then(()=>boot(true)).then(()=>{ if(V==="menu") R(); }).catch(()=>{});
  }catch(err){
    if(!silent){ V="error"; R(); } else throw err;
  }
}
window.boot=boot;
boot();
