<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULSE">
<meta name="theme-color" content="#0a0b0d">
<title>PULSE · Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b0d;--card:#15181e;--card2:#0c0e12;--line:rgba(255,255,255,.08);
  --text:#eceef1;--muted:#868d97;--dim:#3a4049;--accent:#3fdc6e;--accent2:#9ee600;--warn:#ff6a3d;
}
body{background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
.disp{font-family:'Big Shoulders Display',-apple-system,system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{display:none}
a{text-decoration:none}

.pg{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.sp{padding:14px 16px 120px;max-width:560px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;letter-spacing:.16em}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
.sub{font-size:12.5px;color:var(--muted);font-weight:600}

/* hero next */
.hero{display:block;width:100%;text-align:left;border:none;cursor:pointer;border-radius:18px;padding:18px;margin:14px 0 18px;
  background:linear-gradient(135deg,rgba(63,220,110,.16),rgba(12,14,18,.4));border:1px solid rgba(63,220,110,.3);color:var(--text)}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero .name{font-size:30px;line-height:1;margin:6px 0 4px}
.hero .meta{font-size:13px;color:var(--muted)}
.hero .arrow{float:right;font-size:26px;color:var(--accent);margin-top:6px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat .num{font-size:26px;line-height:1}
.stat .num small{font-size:14px;color:var(--muted)}
.stat .cap{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:5px}

.lb{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px}
.lb.mt{margin-top:24px}

/* day buttons */
.day{width:100%;padding:15px 16px;margin-bottom:9px;background:var(--card);border:none;border-left:4px solid;border-radius:14px;color:var(--text);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:transform .12s}
.day:active{transform:scale(.985)}
.day .dn{font-size:17px;font-weight:800}
.day .ds{font-size:12px;color:var(--muted);margin-top:2px}
.day .dr{text-align:right}
.day .dd{font-size:11px;color:var(--muted)}
.day .da{font-size:22px}
.nextpill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}

/* history rows */
.hrow{width:100%;padding:13px 15px;margin-bottom:8px;background:var(--card);border:none;border-radius:12px;color:var(--text);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.hrow .hn{font-weight:800}
.hrow .hd{font-size:12px;color:var(--muted);margin-left:8px}
.hrow .ha{color:var(--dim)}
.empty{font-size:13.5px;color:var(--dim);padding:6px 2px}

/* nav back */
.back{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:8px;font-family:inherit}

/* logging */
.loghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.loghead h2{font-size:24px;margin:0}
.ec{background:var(--card);border-radius:16px;padding:14px;margin-bottom:11px;border-left:3px solid}
.ectop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exn{font-size:15.5px;font-weight:800}
.exm{font-size:11px;color:var(--muted);margin-top:2px}
.exprev{font-size:10.5px;color:var(--dim);margin-top:3px}
.exlast{font-size:11px;color:var(--muted);margin-top:4px}
.exlast b{color:var(--text);font-weight:700}
.extgt{font-size:12px;font-weight:800;margin-top:4px;display:flex;align-items:center;gap:5px}
.form{flex-shrink:0;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:800}
.setrow{display:flex;align-items:center;gap:7px;margin-top:7px}
.stag{font-size:11px;width:26px;text-align:center;color:var(--dim);font-weight:700}
.inp{flex:1;height:52px;background:var(--card2);border:2px solid var(--line);border-radius:12px;font-size:21px;font-weight:800;text-align:center;outline:none;color:var(--text);width:100%;font-family:inherit;transition:border-color .15s}
.inp.kg{color:var(--accent)}
.x{font-size:18px;font-weight:800;color:var(--dim)}
.exctl{display:flex;gap:8px;margin-top:9px}
.exctl button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.exctl button:active{transform:scale(.97)}

/* save bar */
.savebar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%);max-width:560px;margin:0 auto}
.savebar button{width:100%;padding:18px;border:none;border-radius:14px;color:#06140a;font-size:18px;font-weight:900;cursor:pointer;font-family:'Big Shoulders Display',sans-serif;letter-spacing:.04em}
.savebar button:active{transform:scale(.985)}

/* detail */
.exblock{background:var(--card);border-radius:13px;padding:13px;margin-bottom:8px}
.exblock .ebn{font-size:14px;font-weight:800;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border-radius:8px;padding:6px 12px;font-size:14px}
.chip .k{color:var(--accent);font-weight:800}
.chip .u{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;margin-top:16px}
.bcopy{flex:1;padding:15px;background:var(--card);border:1.5px solid rgba(63,220,110,.4);border-radius:13px;color:var(--accent);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.bedit{padding:15px 20px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;color:var(--text);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.bdel{padding:15px 18px;background:transparent;border:1.5px solid rgba(255,106,61,.4);border-radius:13px;color:var(--warn);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}

/* peso / bodyweight */
.wcard{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:20px;cursor:pointer;color:var(--text);text-align:left;font-family:inherit}
.wcard:active{transform:scale(.99)}
.wcard-kg{font-size:28px;line-height:1;color:var(--accent)}
.wcard-kg small{font-size:14px;color:var(--muted);margin-left:2px}
.wcard-d{font-size:12px;color:var(--muted);margin-left:10px}
.wcard-empty{font-size:14px;color:var(--muted)}
.wbig{margin:2px 0 16px}
.wkg{font-size:50px;line-height:1;color:var(--accent)}
.wkg small{font-size:18px;color:var(--muted);margin-left:3px}
.wsub{font-size:13.5px;color:var(--muted);margin-top:6px}
.wform{display:flex;gap:8px;margin-bottom:16px}
.wform .inp{flex:1}
.wsave{flex-shrink:0;padding:0 24px;background:var(--accent);color:#06140a;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Big Shoulders Display',sans-serif;letter-spacing:.03em}
.wsave:active{transform:scale(.97)}
.wchartwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:4px}
.wsvg{width:100%;height:120px;display:block}
.wrange{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
.wrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:12px 15px;margin-bottom:8px}
.wrow .hd{font-size:12px;color:var(--muted);margin-left:10px}
.wdel{background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;padding:4px 8px}
.wdel:active{color:var(--warn)}

/* done screen */
.done{padding:40px 16px;text-align:center;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.done .big{font-size:54px;margin-bottom:10px}
.done h2{font-size:26px;color:var(--accent);margin:0 0 4px}
.done .meta{font-size:14px;color:var(--muted);margin-bottom:22px}
.dline{width:100%;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card);font-size:13.5px;gap:12px}
.dline .v{color:var(--accent);font-weight:700;text-align:right}
.bmenu{margin-top:26px;padding:15px 50px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.bnuke{margin-top:24px;width:100%;padding:11px;background:transparent;border:1px solid rgba(255,106,61,.2);border-radius:10px;color:var(--warn);font-size:12px;cursor:pointer;font-family:inherit}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#06140a;padding:11px 26px;border-radius:11px;font-weight:800;font-size:14px;z-index:999;animation:fo 2s forwards}
@keyframes fo{0%,70%{opacity:1}100%{opacity:0}}
.reveal{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ── workout library (Bruno · Phase 2) ── */
const W={
"Upper A":{c:"#4A90D9",sub:"Push + Pull Horizontal",ex:[
{n:"Chest Press Machine",m:"Peito",s:3,t:"12-15",v:"https://www.youtube.com/shorts/Qu7-ceCvq7w"},
{n:"Cable Row",m:"Costas",s:3,t:"12-15",v:"https://www.youtube.com/shorts/LyZH4UGdDTc"},
{n:"Chest Fly Machine",m:"Peito",s:3,t:"12-15",v:"https://www.youtube.com/shorts/a9vQ_hwIksU"},
{n:"Cable Lateral Raises",m:"Delts lat.",s:3,t:"12-15",v:"https://www.youtube.com/shorts/Sh61DLlmpAw"},
{n:"Tricep Pushdown",m:"Tríceps",s:3,t:"12-15",v:"https://www.youtube.com/shorts/IKQ_bKGT3LQ"},
{n:"Lying Tricep Ext. (EZ)",m:"Tríceps",s:3,t:"12-15",v:"https://www.youtube.com/shorts/K3mFeNz4e3w"},
{n:"Incline Curls",m:"Bíceps",s:3,t:"12-15",v:"https://www.youtube.com/shorts/slC0OBYb7EI"},
{n:"Leg Raises",m:"Abs",s:3,t:"15",v:"https://www.youtube.com/shorts/AKvRTjwkkHw"}
]},
"Lower A":{c:"#3FB950",sub:"Máquinas",ex:[
{n:"Leg Extension",m:"Quads",s:3,t:"12-15",v:"https://www.youtube.com/shorts/iQ92TuvBqRo"},
{n:"Seated Leg Curl",m:"Hamstrings",s:3,t:"12-15",v:"https://www.youtube.com/shorts/_lgE0gPvbik"},
{n:"Standing Calf Raise",m:"Gémeos",s:3,t:"15",v:"https://www.youtube.com/shorts/baEXLy09Ncc"},
{n:"Leg Raises",m:"Abs",s:3,t:"15",v:"https://www.youtube.com/shorts/AKvRTjwkkHw"}
]},
"Upper B":{c:"#A371F7",sub:"Pull + Push Vertical",ex:[
{n:"Assisted Pull-ups",m:"Costas",s:3,t:"max",v:"https://www.youtube.com/shorts/b3L_d3zACC0"},
{n:"Machine Low Row",m:"Costas",s:3,t:"12-15",v:"https://www.youtube.com/shorts/0ncjdn9NkEQ"},
{n:"DB Pullover",m:"Lats/Peito",s:3,t:"12-15",v:"https://www.youtube.com/watch?v=jQjWlIwG4sI"},
{n:"DB Chest Press",m:"Peito",s:3,t:"12-15",v:"https://www.youtube.com/shorts/8fXfwG4ftaQ"},
{n:"Assisted Dips",m:"Peito/Tríc.",s:3,t:"max",v:"https://www.youtube.com/shorts/EQmyN04oTq4"},
{n:"Face Pulls",m:"Delts post.",s:3,t:"15",v:"https://www.youtube.com/shorts/8686PLZB_1Q"},
{n:"Cable Lateral Raises",m:"Delts lat.",s:3,t:"12-15",v:"https://www.youtube.com/shorts/Sh61DLlmpAw"},
{n:"Leg Raises",m:"Abs",s:3,t:"15",v:"https://www.youtube.com/shorts/AKvRTjwkkHw"}
]},
"Lower B":{c:"#D29922",sub:"Máquinas",ex:[
{n:"Leg Extension",m:"Quads",s:3,t:"12-15",v:"https://www.youtube.com/shorts/iQ92TuvBqRo"},
{n:"Seated Leg Curl",m:"Hamstrings",s:3,t:"12-15",v:"https://www.youtube.com/shorts/_lgE0gPvbik"},
{n:"Standing Calf Raise",m:"Gémeos",s:3,t:"15",v:"https://www.youtube.com/shorts/baEXLy09Ncc"},
{n:"Leg Raises",m:"Abs",s:3,t:"15",v:"https://www.youtube.com/shorts/AKvRTjwkkHw"}
]},
"Home":{c:"#58A6FF",sub:"Bodyweight",ex:[
{n:"Pushups",m:"Peito/Tríc.",s:3,t:"max",v:""},
{n:"Bodyweight Squats",m:"Quads/Glút.",s:3,t:"20",v:""},
{n:"Plank Knee to Elbow",m:"Core",s:3,t:"15",v:"https://www.youtube.com/watch?v=I_syux99Bug"},
{n:"Leg Raises (chão)",m:"Abs",s:3,t:"15",v:"https://www.youtube.com/shorts/AKvRTjwkkHw"}
]}
};
const ROT=["Upper A","Lower A","Upper B","Lower B"];
const TARGET=4;

/* ── storage (same key + schema as before → existing history loads) ── */
const SK="bruno-gym-v2";
const load=()=>{try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return[]}};
const sav=(h)=>{try{localStorage.setItem(SK,JSON.stringify(h))}catch(e){}};
const WSK="bruno-weight-v1";
const loadW=()=>{try{return JSON.parse(localStorage.getItem(WSK))||[]}catch(e){return[]}};
const savW=(w)=>{try{localStorage.setItem(WSK,JSON.stringify(w))}catch(e){}};

/* ── date helpers ── */
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],MON=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const fd=(d)=>{const t=new Date(d);return DOW[t.getDay()]+" "+t.getDate()+" "+MON[t.getMonth()]};
const dayKey=(d)=>{const t=new Date(d);return t.getFullYear()+"-"+t.getMonth()+"-"+t.getDate()};
const lastOf=(h,n)=>[...h].reverse().find(s=>s.w===n);
function startWeek(){const x=new Date();x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function daysSince(d){const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}
function nextDay(){const done=ROT.map(n=>lastOf(H,n)).filter(Boolean);if(!done.length)return"Upper A";let last=null,lt=0;done.forEach(s=>{const t=new Date(s.d).getTime();if(t>lt){lt=t;last=s.w}});const i=ROT.indexOf(last);return ROT[(i+1)%ROT.length]}

/* ── state ── */
let H=load(),V="menu",WK=null,DT={},DET=null,TT=null,EDIT=null;
let WT=loadW();
const $=()=>document.getElementById("app");

function R(){
if(TT){setTimeout(()=>{TT=null;R()},2000)}

/* ===== MENU / DASHBOARD ===== */
if(V==="menu"){
const wk=H.filter(s=>new Date(s.d)>=startWeek()).length;
const lastS=H.length?[...H].sort((a,b)=>new Date(b.d)-new Date(a.d))[0]:null;
const since=lastS?daysSince(lastS.d):null;
const sinceTxt=since===null?"–":since===0?"Hoje":since===1?"Ontem":since+"d";
const nx=nextDay(),nw=W[nx];
let h=`<div class="pg reveal">`;
h+=`<div class="top"><div class="logo disp"><span class="dot"></span>PULSE</div><div class="sub">Phase 2</div></div>`;

h+=`<button class="hero" onclick="go('${nx}')"><span class="arrow">→</span>
<div class="eyebrow">A seguir</div>
<div class="name disp" style="color:${nw.c}">${nx}</div>
<div class="meta">${nw.sub} · ${nw.ex.length} exercícios</div></button>`;

h+=`<div class="stats">
<div class="stat"><div class="num disp">${wk}<small>/${TARGET}</small></div><div class="cap">Esta semana</div></div>
<div class="stat"><div class="num disp">${H.length}</div><div class="cap">Sessões</div></div>
<div class="stat"><div class="num disp">${sinceTxt}</div><div class="cap">Último treino</div></div>
</div>`;

const _wa=wSorted();const _wl=_wa.length?_wa[_wa.length-1]:null;const _wp=_wa.length>1?_wa[_wa.length-2]:null;
h+=`<button class="wcard" onclick="goPeso()"><div><span class="lb" style="margin:0 0 6px;display:block">Peso corporal</span>`;
if(_wl){const _dd=_wp?+(_wl.kg-_wp.kg).toFixed(1):null;h+=`<span class="wcard-kg disp">${_wl.kg}<small>kg</small></span>${_dd!==null?`<span class="wcard-d">${_dd>0?"+":""}${_dd} desde a última</span>`:""}`;}
else h+=`<span class="wcard-empty">Toca para registar a tua primeira pesagem →</span>`;
h+=`</div><span class="da" style="color:var(--accent)">→</span></button>`;

h+=`<p class="lb">Treinar</p>`;
for(const[n,w]of Object.entries(W)){const p=lastOf(H,n);
h+=`<button class="day" style="border-left-color:${w.c}" onclick="go('${n}')">
<div><div class="dn" style="color:${w.c}">${n}${n===nx?`<span class="nextpill" style="background:${w.c}22;color:${w.c}">a seguir</span>`:""}</div><div class="ds">${w.sub} · ${w.ex.length} ex.</div></div>
<div class="dr">${p?`<div class="dd">${fd(p.d)}</div>`:""}<div class="da" style="color:${w.c}">→</div></div></button>`;}

h+=`<p class="lb mt">Histórico</p>`;
if(H.length===0)h+=`<p class="empty">Ainda sem sessões. Toca num treino para começar.</p>`;
[...H].reverse().slice(0,12).forEach(s=>{
h+=`<button class="hrow" onclick="det(${s.id})"><span><span class="hn" style="color:${W[s.w]?.c||'#E6EDF3'}">${s.w}</span><span class="hd">${fd(s.d)}</span></span><span class="ha">→</span></button>`;});
h+=`</div>`;$().innerHTML=h;return;}

/* ===== LOG ===== */
if(V==="go"&&WK){const w=W[WK],p=lastOf(H,WK);
let h=`<div class="sp reveal"><div class="loghead">
<button class="back" onclick="menu()">← sair</button>
<h2 class="disp" style="color:${w.c}">${WK}</h2><div style="width:40px"></div></div>`;
if(EDIT)h+=`<div style="background:rgba(63,220,110,.1);border:1px solid rgba(63,220,110,.3);color:var(--accent);border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:12px;font-weight:700">A editar sessão · ${fd(EDIT.d)}</div>`;

w.ex.forEach((ex,ei)=>{const pe=p?.ex?.[ei];const rows=DT[ei]||[];const tg=EDIT?null:targetFor(ex,pe);
h+=`<div class="ec" style="border-left-color:${w.c}55">
<div class="ectop"><div style="flex:1">
<div class="exn">${ex.n}</div>
<div class="exm">${ex.m} · ${ex.s} séries</div>
${tg&&tg.lastTxt?`<div class="exlast">Última: <b>${tg.lastTxt}</b></div>`:""}
${tg?`<div class="extgt" style="color:${w.c}">🎯 ${tg.txt}</div>`:""}
</div>`;
if(ex.v)h+=`<a href="${ex.v}" target="_blank" rel="noopener" class="form" style="background:${w.c}1f;border:1.5px solid ${w.c}55;color:${w.c}">▶ Form</a>`;
h+=`</div>`;
rows.forEach((sv,si)=>{
h+=`<div class="setrow"><span class="stag">S${si+1}</span>
<input type="number" inputmode="decimal" placeholder="kg" value="${sv.kg}" class="inp kg" onchange="up(${ei},${si},'kg',this.value)" onfocus="this.style.borderColor='${w.c}'" onblur="this.style.borderColor='var(--line)'">
<span class="x">×</span>
<input type="number" inputmode="numeric" placeholder="reps" value="${sv.reps}" class="inp" onchange="up(${ei},${si},'reps',this.value)" onfocus="this.style.borderColor='${w.c}'" onblur="this.style.borderColor='var(--line)'">
</div>`;});
h+=`<div class="exctl">
<button onclick="fillDown(${ei})">↓ Repetir S1</button>
<button onclick="addSet(${ei})">+ série</button>
${rows.length>1?`<button onclick="remSet(${ei})">− série</button>`:""}
</div></div>`;});

h+=`<div class="savebar"><button style="background:${w.c}" onclick="done()">✓ GUARDAR TREINO</button></div></div>`;
$().innerHTML=h;return;}

/* ===== DETAIL ===== */
if(V==="det"&&DET){const wc=W[DET.w]?.c||"#E6EDF3";
let h=`<div class="pg reveal"><button class="back" onclick="menu()">← voltar</button>
<h2 class="disp" style="font-size:22px;color:${wc};margin:0 0 2px">${DET.w}</h2>
<p style="font-size:13px;color:var(--muted);margin:0 0 16px">${fd(DET.d)}</p>`;
DET.ex.forEach(e=>{h+=`<div class="exblock"><div class="ebn">${e.n}</div><div class="chips">`;
e.s.forEach(s=>{h+=`<div class="chip"><span class="k">${s.kg}</span><span class="u">kg ×</span> <b>${s.reps}</b></div>`;});
h+=`</div></div>`;});
h+=`<div class="actions">
<button class="bcopy" onclick="cp(${DET.id})">📋 Copiar para Claude</button>
<button class="bedit" onclick="editS(${DET.id})">Editar</button>
<button class="bdel" onclick="delS(${DET.id})">Apagar</button>
</div></div>`;
$().innerHTML=h;return;}

/* ===== PESO ===== */
if(V==="peso"){
const arr=wSorted();
const last=arr.length?arr[arr.length-1]:null;
const prev=arr.length>1?arr[arr.length-2]:null;
const delta=last&&prev?+(last.kg-prev.kg).toFixed(1):null;
const deltaTxt=delta===null?"":(delta>0?"+":"")+delta+" kg desde a última";
let m30="";
if(arr.length>1){const cut=Date.now()-30*86400000;const old=arr.filter(p=>new Date(p.d).getTime()<=cut);const ref=old.length?old[old.length-1]:arr[0];const d30=+(last.kg-ref.kg).toFixed(1);m30=(d30>0?"+":"")+d30+" kg / 30d";}
let h=`<div class="pg reveal"><button class="back" onclick="menu()">← voltar</button>
<h2 class="disp" style="font-size:24px;margin:0 0 14px">Peso corporal</h2>`;
h+=`<div class="wbig">`;
if(last)h+=`<span class="wkg disp">${last.kg}<small>kg</small></span><div class="wsub">${deltaTxt}${m30?` · ${m30}`:""}</div>`;
else h+=`<div class="wsub">Sem pesagens ainda. Regista a primeira em baixo.</div>`;
h+=`</div>`;
const pf=last?last.kg:"";
h+=`<div class="wform"><input id="wi" type="number" inputmode="decimal" step="0.1" placeholder="kg hoje" value="${pf}" class="inp kg" style="font-size:24px"><button class="wsave" onclick="addW()">Guardar</button></div>`;
h+=`<div class="wchartwrap">${wChart(arr)}</div>`;
h+=`<p class="lb mt">Histórico de peso</p>`;
if(!arr.length)h+=`<p class="empty">Ainda sem registos.</p>`;
[...arr].reverse().forEach(p=>{h+=`<div class="wrow"><span><b>${p.kg} kg</b><span class="hd">${fd(p.d)}</span></span><button class="wdel" onclick="delW(${p.id})">✕</button></div>`;});
h+=`</div>`;
if(TT)h+=`<div class="toast">${TT}</div>`;
$().innerHTML=h;return;}

/* ===== DONE ===== */
if(V==="done"&&DET){
let h=`<div class="done reveal"><div class="big">💪</div>
<h2 class="disp">${EDIT?"Atualizado!":"Guardado!"}</h2>
<p class="meta">${DET.w} · ${fd(DET.d)}</p><div style="width:100%;max-width:360px">`;
DET.ex.forEach(e=>{h+=`<div class="dline"><span>${e.n}</span><span class="v">${e.s.map(s=>s.kg+"×"+s.reps).join("  ")}</span></div>`;});
h+=`</div>
<button class="bcopy" style="max-width:360px;width:100%;margin-top:18px" onclick="cp(${DET.id})">📋 Copiar para Claude</button>
<button class="bmenu" onclick="menu()">← Menu</button></div>`;
if(TT)h+=`<div class="toast">${TT}</div>`;
$().innerHTML=h;return;}
}

/* ── actions ── */
window.go=function(n){const w=W[n],p=lastOf(H,n);EDIT=null;DT={};
w.ex.forEach((e,i)=>{DT[i]=Array.from({length:e.s},(_,s)=>({kg:p?.ex?.[i]?.s?.[s]?.kg??"",reps:p?.ex?.[i]?.s?.[s]?.reps??""}))});
WK=n;V="go";R()};

window.up=function(ei,si,f,v){if(!DT[ei])DT[ei]=[];if(!DT[ei][si])DT[ei][si]={kg:"",reps:""};DT[ei][si][f]=v};
window.addSet=function(ei){DT[ei].push({kg:"",reps:""});R()};
window.remSet=function(ei){if(DT[ei].length>1)DT[ei].pop();R()};
window.fillDown=function(ei){const f=DT[ei][0];if(!f)return;DT[ei]=DT[ei].map(()=>({kg:f.kg,reps:f.reps}));R()};

window.done=function(){const w=W[WK];
const ex=w.ex.map((x,i)=>({n:x.n,s:(DT[i]||[]).map(s=>({kg:s.kg===""?0:+s.kg,reps:s.reps===""?0:+s.reps}))}));
if(EDIT){const e=H.find(s=>s.id===EDIT.id);if(e){e.ex=ex;sav(H);DET=e}EDIT=null}
else{const e={id:Date.now(),w:WK,d:new Date().toISOString(),ex};H.push(e);sav(H);DET=e}
V="done";R()};

window.editS=function(id){const s=H.find(x=>x.id===id);if(!s)return;EDIT=s;WK=s.w;DT={};
W[s.w].ex.forEach((x,i)=>{const se=s.ex[i]?.s||[];DT[i]=se.length?se.map(v=>({kg:v.kg,reps:v.reps})):Array.from({length:x.s},()=>({kg:"",reps:""}))});
V="go";R()};

window.delS=function(id){if(confirm("Apagar esta sessão?")){H=H.filter(s=>s.id!==id);sav(H);menu()}};
window.menu=function(){V="menu";EDIT=null;R()};
window.det=function(id){DET=H.find(s=>s.id===id);if(DET){V="det";R()}};

window.cp=function(id){const s=H.find(x=>x.id===id)||DET;if(!s)return;
let t=s.w+" · "+fd(s.d)+"\n";
s.ex.forEach(e=>{t+=e.n+": "+e.s.map(x=>x.kg+"kg×"+x.reps).join(" / ")+"\n"});
const ok=()=>{TT="✓ Copiado!";R()};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(()=>fb(t,ok))}else fb(t,ok)};
function fb(t,ok){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);ok()}

/* ── progression target (double progression 8→12) ── */
const REP_LOW=8,REP_HIGH=12;
function fmtSets(s){return s.map(x=>x.kg>0?`${x.kg}×${x.reps}`:`${x.reps}`).join(" / ")}
function targetFor(ex,pe){
if(!pe||!pe.s||!pe.s.length)return {txt:`primeira vez — define a tua base (~${ex.t} reps)`,lastTxt:""};
const sets=pe.s,lastTxt=fmtSets(sets);
const work=sets.filter(x=>x.reps>0);
if(!work.length)return {txt:`primeira vez — define a tua base (~${ex.t} reps)`,lastTxt};
const w=work[0].kg,minR=Math.min(...work.map(x=>x.reps)),maxR=Math.max(...work.map(x=>x.reps));
if(ex.t==="max"||w<=0)return {txt:`supera ${w>0?w+"kg × ":""}${maxR} reps`,lastTxt};
if(minR>=REP_HIGH)return {txt:`⬆ sobe o peso (estás em ${w}kg) · faz ${REP_LOW} reps`,lastTxt};
return {txt:`${w}kg · sobe para ${Math.min(minR+1,REP_HIGH)} reps`,lastTxt};
}

/* ── bodyweight ── */
const wSorted=()=>[...WT].sort((a,b)=>new Date(a.d)-new Date(b.d));
function wChart(arr){
if(arr.length<2)return `<p class="empty" style="margin:0">Regista pelo menos duas pesagens para veres a tendência.</p>`;
const pts=arr.slice(-16),kgs=pts.map(p=>p.kg);
const mn=Math.min(...kgs),mx=Math.max(...kgs),pd=(mx-mn)*0.25||1,lo=mn-pd,hi=mx+pd;
const VW=320,VH=120,P=12;
const x=i=>P+(i*(VW-2*P)/(pts.length-1));
const y=v=>VH-P-((v-lo)/(hi-lo))*(VH-2*P);
const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.kg).toFixed(1)}`).join(" ");
const area=`M${x(0).toFixed(1)} ${y(pts[0].kg).toFixed(1)} ${pts.map((p,i)=>i?`L${x(i).toFixed(1)} ${y(p.kg).toFixed(1)}`:"").join(" ")} L${x(pts.length-1).toFixed(1)} ${VH-P} L${x(0).toFixed(1)} ${VH-P} Z`;
const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join("");
return `<svg viewBox="0 0 ${VW} ${VH}" class="wsvg" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><div class="wrange">${mn} – ${mx} kg · últimas ${pts.length} pesagens</div>`;
}
window.goPeso=function(){V="peso";R()};
window.addW=function(){const el=document.getElementById("wi");if(!el)return;const v=parseFloat((el.value||"").replace(",","."));if(!v||v<=0)return;
const today=dayKey(new Date());const ex=WT.find(p=>dayKey(p.d)===today);
if(ex)ex.kg=+v.toFixed(1);else WT.push({id:Date.now(),d:new Date().toISOString(),kg:+v.toFixed(1)});
savW(WT);TT="✓ Peso guardado!";R()};
window.delW=function(id){WT=WT.filter(p=>p.id!==id);savW(WT);R()};

R();
</script>
</body>
</html>
